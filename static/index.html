<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>MRMS Radar</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --panel-bg:rgba(18,20,26,.68);
    --panel-border:rgba(255,255,255,.06);
    --text:#e8eaed;
    --text-muted:#8b9098;
    --accent:#5b9ef5;
    --danger:#f0625c;
    --radius:14px;
    --blur:18px;
  }

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#0d1117;
    color:var(--text);
    overflow:hidden;
    height:100dvh;width:100vw;
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
  }

  /* ── Map ── */
  .map-container{
    position:fixed;inset:0;
    overflow:hidden;
    cursor:grab;
    background:#0a0e14;
  }
  .map-container:active,.map-container.dragging{cursor:grabbing}

  #leafletMap{
    position:absolute;top:50%;left:50%;
    width:920px;height:630px;
    transform:translate(-50%,-50%);
    transform-origin:center center;
    pointer-events:none;
  }

  .map-loading,.map-error{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:12px;
    z-index:10;transition:opacity .25s;
  }
  .map-loading{color:var(--text-muted);font-size:14px;pointer-events:none}
  .map-loading.hidden{opacity:0}
  .map-error{display:none;color:var(--danger);font-size:14px;text-align:center;
    background:rgba(0,0,0,.7);padding:24px 32px;border-radius:12px;max-width:300px}
  .map-error.show{display:flex}

  .anim-loading{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(0,0,0,.85);padding:20px 32px;border-radius:14px;
    z-index:20;display:none;flex-direction:column;align-items:center;gap:12px;
    pointer-events:none;
  }
  .anim-loading.show{display:flex}
  .anim-loading .spinner{width:32px;height:32px}
  .anim-loading .progress{font-size:13px;color:var(--text-muted)}

  .spinner{
    width:28px;height:28px;
    border:3px solid rgba(255,255,255,.1);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── Floating panels ── */
  .floating{
    position:fixed;
    background:var(--panel-bg);
    backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    z-index:100;
    transition:opacity .3s,transform .3s;
  }

  /* ── Corner buttons ── */
  .corner-btn{
    position:fixed;
    top:max(12px,env(safe-area-inset-top));
    width:38px;height:38px;border-radius:50%;
    border:1px solid var(--panel-border);
    background:var(--panel-bg);
    backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
    color:var(--text);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    z-index:100;
  }
  .corner-btn.left{left:12px}
  .corner-btn.right{right:12px}

  .icon-btn{
    width:38px;height:38px;border-radius:50%;border:none;
    background:transparent;color:var(--text);font-size:18px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.06)}
  .icon-btn:active{background:rgba(255,255,255,.12)}

  /* ── Side panel ── */
  .side-panel{
    position:fixed;top:0;left:0;bottom:0;
    width:min(340px,88vw);
    background:var(--panel-bg);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border-right:1px solid var(--panel-border);
    z-index:200;
    padding:max(18px,env(safe-area-inset-top)) 18px 18px;
    transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    overflow-y:auto;
    display:flex;flex-direction:column;gap:20px;
  }
  .side-panel.open{transform:translateX(0)}

  .panel-header{display:flex;align-items:center;justify-content:space-between}
  .panel-header h2{font-size:18px;font-weight:600}

  .section-label{
    font-size:10px;text-transform:uppercase;letter-spacing:1.2px;
    color:var(--text-muted);margin-bottom:6px;
  }

  /* Select styling */
  select{
    width:100%;background:rgba(255,255,255,.05);
    border:1px solid var(--panel-border);border-radius:10px;
    color:var(--text);padding:12px 14px;font-size:14px;outline:none;
    -webkit-appearance:none;appearance:none;
    cursor:pointer;
  }
  select option{background:#181a22;color:var(--text)}

  /* Level slider */
  .level-slider-wrap{margin-top:4px}
  .level-value{
    text-align:center;font-size:24px;font-weight:300;
    color:var(--accent);margin-bottom:4px;
  }
  input[type=range]{
    width:100%;-webkit-appearance:none;
    height:4px;background:rgba(255,255,255,.1);
    border:none;border-radius:2px;outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:24px;height:24px;border-radius:50%;
    background:var(--accent);cursor:pointer;
    box-shadow:0 0 16px rgba(91,158,245,.4);
  }
  .level-labels{
    display:flex;justify-content:space-between;
    font-size:10px;color:var(--text-muted);margin-top:2px;
  }

  .backdrop{
    position:fixed;inset:0;z-index:150;
    background:rgba(0,0,0,.45);
    opacity:0;pointer-events:none;transition:opacity .28s;
  }
  .backdrop.show{opacity:1;pointer-events:auto}

  /* ── Bottom bar ── */
  .bottom-bar{
    bottom:max(16px,env(safe-area-inset-bottom));
    left:50%;transform:translateX(-50%);
    padding:12px 18px;
    display:flex;flex-direction:column;gap:10px;
    min-width:min(420px,92vw);
  }

  /* Current product badge */
  .product-badge{
    display:flex;align-items:center;gap:8px;
    font-size:12px;color:var(--text-muted);
  }
  .product-badge strong{color:var(--text);font-weight:500}

  /* Time */
  .time-controls{display:flex;align-items:center;gap:10px}
  .time-nav{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--panel-border);
    background:rgba(255,255,255,.05);color:var(--text);
    font-size:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:background .15s;
  }
  .time-nav:hover{background:rgba(255,255,255,.1)}
  .time-nav.now-btn{width:auto;padding:0 12px;border-radius:16px;font-size:11px;font-weight:700}

  .time-display{
    text-align:center;font-size:28px;font-weight:300;letter-spacing:-.5px;
    font-variant-numeric:tabular-nums;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .live-dot{
    display:inline-block;width:7px;height:7px;
    background:var(--danger);border-radius:50%;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  .time-slider-wrap{flex:1;min-width:0}
  .time-labels{
    display:flex;justify-content:space-between;
    font-size:10px;color:var(--text-muted);margin-top:2px;
  }

  /* ── Zoom stack (desktop) ── */
  /* ── Colorbar ── */
  .colorbar{
    position:fixed;right:12px;top:50%;transform:translateY(-50%);
    width:54px;height:330px;
    background:rgba(255,255,255,.62);
    backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
    border:1px solid var(--panel-border);
    border-radius:8px;
    z-index:100;
    display:flex;
    padding:0;
    transition:opacity .3s;
  }
  .colorbar.hidden{opacity:0;pointer-events:none}
  .colorbar-img{
    width:100%;height:100%;object-fit:contain;
  }

  /* ── Responsive ── */
  @media(max-width:640px){
    .bottom-bar{min-width:auto;left:12px;right:12px;transform:none;padding:10px 14px}
    .time-display{font-size:22px}
    .side-panel{width:100vw}
    .level-value{font-size:20px}
    .colorbar{right:6px;width:42px;height:270px;top:50%;transform:translateY(-50%)}
  }

  /* ── Terminal Panel ── */
  .terminal-panel {
    position: fixed;
    bottom: calc(max(16px, env(safe-area-inset-bottom)) + 120px);
    right: 12px;
    width: min(500px, 90vw);
    height: 300px;
    background: rgba(10, 12, 16, 0.72);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    z-index: 100;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateY(20px);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .terminal-panel.open {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .terminal-header {
    background: rgba(255, 255, 255, 0.03);
    border-bottom: 1px solid var(--panel-border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .terminal-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .terminal-title .status-dot {
    width: 6px;
    height: 6px;
    background-color: var(--danger);
    border-radius: 50%;
  }
  .terminal-title .status-dot.ready {
    background-color: #58a6ff;
    box-shadow: 0 0 8px rgba(88, 166, 255, 0.6);
  }
  .terminal-title .status-dot.loading {
    background-color: #f0c674;
    animation: pulse 1.5s ease-in-out infinite;
  }
  .terminal-close {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s;
  }
  .terminal-close:hover {
    color: var(--text);
  }
  #terminal-body {
    flex: 1;
    padding: 8px;
    overflow: hidden;
  }
  .terminal-toggle-btn {
    position: fixed;
    right: 12px;
    bottom: calc(max(16px, env(safe-area-inset-bottom)) + 70px);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--panel-border);
    background: var(--panel-bg);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: background 0.15s;
  }
  .terminal-toggle-btn:hover {
    background: rgba(255, 255, 255, 0.08);
  }
</style>
</head>
<body>

<!-- Map -->
<div class="map-container" id="mapContainer">
  <div id="leafletMap"></div>
  <img class="map-image" id="mapImage" alt="" draggable="false" style="display:none">
  <div class="map-loading" id="mapLoading">
    <div class="spinner"></div>
    <span>Loading radar...</span>
  </div>
  <div class="map-error" id="mapError">
    <span style="font-size:40px">⚠</span>
    <span>Failed to load radar image</span>
    <span style="font-size:11px;opacity:.7">Check that the server is running</span>
  </div>
  <div class="anim-loading" id="animLoading">
    <div class="spinner"></div>
    <span class="progress" id="animProgress">Loading radar loop...</span>
  </div>
</div>

<!-- Backdrop -->
<div class="backdrop" id="backdrop" onclick="closePanel()"></div>

<!-- Side panel -->
<div class="side-panel" id="sidePanel">
  <div class="panel-header">
    <h2>MRMS <span style="color:var(--accent)">Radar</span></h2>
    <button class="icon-btn" onclick="closePanel()">✕</button>
  </div>

  <!-- Category -->
  <div>
    <div class="section-label">Product</div>
    <select id="categorySelect"></select>
  </div>

  <!-- Level sub-selector (shown for 3D products) -->
  <div id="levelSection" style="display:none">
    <div class="section-label">Altitude</div>
    <div class="level-slider-wrap">
      <div class="level-value" id="levelValue">4.0 km</div>
      <input type="range" id="levelSlider">
      <div class="level-labels">
        <span id="levelMin">0.5 km</span>
        <span id="levelMax">19 km</span>
      </div>
    </div>
  </div>

  <!-- Sub-product selector (for non-level categories) -->
  <div id="subProductSection" style="display:none">
    <div class="section-label">Variant</div>
    <select id="subProductSelect"></select>
  </div>

  <!-- Zoom -->
  <div>
    <div class="section-label">Zoom Level</div>
    <input type="range" min="3" max="12" value="7" id="zoomSlider">
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted)">
      <span>Continent</span><span>State</span><span>City</span>
    </div>
  </div>

  <!-- Base Map -->
  <div>
    <div class="section-label">Base Map</div>
    <select id="baseMapSelect">
      <option value="osm">Mapnik</option>
      <option value="satellite">Satellite</option>
      <option value="dark" selected>Dark</option>
    </select>
  </div>

  <!-- Opacity -->
  <div>
    <div class="section-label">Radar Opacity</div>
    <input type="range" min="10" max="100" value="100" id="opacitySlider">
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted)">
      <span>10%</span><span>100%</span>
    </div>
  </div>
</div>

<!-- Corner buttons -->
<button class="corner-btn left" onclick="openPanel()">☰</button>
<button class="corner-btn right" onclick="resetView()">⌂</button>



<!-- Colorbar -->
<div class="colorbar" id="colorbarPanel">
  <img class="colorbar-img" id="legendBar" alt="Color scale">
</div>

<!-- Bottom bar -->
<div class="floating bottom-bar">
  <div class="product-badge" id="productBadge">
    <strong>Refl</strong> 4.0 km
  </div>

  <div class="time-display">
    <span class="live-dot" id="liveDot"></span>
    <span id="timeDisplay">--:--</span>
    <span id="localTimeDisplay" style="display:none;margin-left:4px;font-size:13px"></span>
  </div>

  <div class="time-controls">
    <button class="time-nav" onclick="stepTime(1)" title="-2 min">◀</button>
    <div class="time-slider-wrap">
      <input type="range" min="0" max="48" value="48" id="timeSlider">
      <div class="time-labels">
        <span id="labelStart">--:--</span>
        <span id="labelEnd">NOW</span>
      </div>
    </div>
    <button class="time-nav" onclick="stepTime(-1)" title="+2 min">▶</button>
    <button class="time-nav now-btn" id="livePauseBtn" onclick="toggleLivePause()">⏸</button>
    <button class="time-nav now-btn" onclick="goLive()">NOW</button>
  </div>
</div>


<!-- Terminal Panel Overlay -->
<button class="terminal-toggle-btn" id="terminalToggleBtn" onclick="toggleTerminal()" title="Toggle Console">>_</button>
<div class="terminal-panel" id="terminalPanel">
  <div class="terminal-header">
    <div class="terminal-title">
      <div class="status-dot" id="terminalStatusDot"></div>
      <span id="terminalStatusText">Console</span>
    </div>
    <button class="terminal-close" onclick="toggleTerminal()">✕</button>
  </div>
  <div id="terminal-body"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
// Service Worker
// ═══════════════════════════════════════════════════════════════════════════
if('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js');

// ═══════════════════════════════════════════════════════════════════════════
// Shortcuts (must be defined before any usage)
// ═══════════════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);

// ═══════════════════════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════════════════════
const S = {
  categoryIdx: 0,      // index into categories[]
  levelIdx: 0,         // index into category.products[]
  zoom: localStorage.getItem('mrms_zoom') ? parseInt(localStorage.getItem('mrms_zoom')) : 7,
  lat: localStorage.getItem('mrms_lat') ? parseFloat(localStorage.getItem('mrms_lat')) : 40.55,
  lon: localStorage.getItem('mrms_lon') ? parseFloat(localStorage.getItem('mrms_lon')) : -104.68,
  timeSlot: 0, mode: 'live',
  refreshTimer: null, animTimer: null, animFrame: 0,
  animCache: [], animRefreshTimer: null,
  baseMap: localStorage.getItem('mrms_basemap') || 'dark',
  tz: null,          // {tz, abbr, offset_hours} from /api/timezone
  tzLat: 0, tzLon: 0, // last lat/lon used to fetch timezone
};
const SLOTS = 48;
const ANIM_FRAMES = 18;     // frames per animation loop
const ANIM_STEP = 2;        // slots per frame (4 min)
const ANIM_DURATION = 5000; // ms for full loop
const ANIM_INTERVAL = Math.floor(ANIM_DURATION / ANIM_FRAMES);
const MAX_ANIM_SLOT = (ANIM_FRAMES - 1) * ANIM_STEP;  // 34 — maps last frame to slot 0 (now)

const BASEMAPS = {
  osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Esri, Maxar, Earthstar Geographics',
  }),
  dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> contributors, &copy; <a href="https://carto.com/">CARTO</a>',
  }),
};
let leafletMap;

let categories = [];
let dragX = 0, dragY = 0;
let isDragging, dx0, dy0;
let zoomPending = 0, zoomDebounce = null;

// ═══════════════════════════════════════════════════════════════════════════
// Derived
// ═══════════════════════════════════════════════════════════════════════════
function cat()    { return categories[S.categoryIdx]; }
function product(){ return cat() ? cat().products[S.levelIdx] : null; }
function prodCode(){ const p = product(); return p ? p.code : 'M3DL13'; }
function saveSettings(){
  localStorage.setItem('mrms_lat', S.lat);
  localStorage.setItem('mrms_lon', S.lon);
  localStorage.setItem('mrms_zoom', S.zoom);
  localStorage.setItem('mrms_basemap', S.baseMap);
  const c = cat();
  const p = product();
  if(c) localStorage.setItem('mrms_category_code', c.code);
  if(p) localStorage.setItem('mrms_product_code', p.code);
}

// ═══════════════════════════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════════════════════════
function radarUrl(meta=false){
  const p = new URLSearchParams({
    product: prodCode(), lat: S.lat, lon: S.lon, zoom: S.zoom,
    width: 920, height: 630,
  });
  if(S.mode !== 'live'){
    const d = roundSlot(new Date());
    d.setMinutes(d.getMinutes() - S.timeSlot * 2);
    p.set('time', d.toISOString().slice(0,16));
  }
  if(meta) p.set('meta','true');
  return '/api/radar?'+p;
}
function roundSlot(d){
  const m = Math.floor(d.getUTCMinutes()/2)*2;
  return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),m,0,0));
}

function radarUrlForSlot(slot){
  const p = new URLSearchParams({
    product: prodCode(), lat: S.lat, lon: S.lon, zoom: S.zoom,
    width: 920, height: 630,
  });
  const d = roundSlot(new Date());
  d.setMinutes(d.getMinutes() - slot * 2);
  p.set('time', d.toISOString().slice(0,16));
  return '/api/radar?'+p;
}

function legendUrl(){
  return '/api/legend?product=' + prodCode();
}
async function fetchLegend(){
  try{
    const r = await fetch(legendUrl());
    if(!r.ok){ $('colorbarPanel').classList.add('hidden'); return; }
    const svg = await r.text();
    if(!svg.includes('<svg')){ $('colorbarPanel').classList.add('hidden'); return; }
    const blob = new Blob([svg], {type:'image/svg+xml'});
    if($('legendBar').src.startsWith('blob:')) URL.revokeObjectURL($('legendBar').src);
    $('legendBar').src = URL.createObjectURL(blob);
    $('colorbarPanel').classList.remove('hidden');
  }catch(e){
    $('colorbarPanel').classList.add('hidden');
  }
}

async function fetchImage(){
  fetchLegend();
  const url = radarUrl();
  $('mapLoading').classList.remove('hidden');
  $('mapError').classList.remove('show');
  try{
    const r = await fetch(url);
    if(!r.ok) throw Error('HTTP '+r.status);
    const blob = await r.blob();
    updateRadarOverlay(URL.createObjectURL(blob));
    $('mapLoading').classList.add('hidden');
    syncMap();
    const ts = r.headers.get('X-MRMS-Timestamp')||'';
    updateTimeDisplay(ts);
  }catch(e){
    console.error(e);
    $('mapLoading').querySelector('span').textContent='Retrying...';
    setTimeout(fetchImage,3000);
  }
}

function updateTimeDisplay(ts){
  const parts = ts.split('T');
  if(parts.length<2) return;
  const t = parts[1].slice(0,5);
  $('timeDisplay').textContent = t + ' UTC';
  if(S.tz){
    const [h,m] = t.split(':').map(Number);
    const totalMins = h * 60 + m + S.tz.offset_hours * 60;
    const localMins = ((totalMins % 1440) + 1440) % 1440;
    const lh = Math.floor(localMins / 60), lm = localMins % 60;
    $('localTimeDisplay').textContent = `(${String(lh).padStart(2,'0')}:${String(lm).padStart(2,'0')} ${S.tz.abbr})`;
    $('localTimeDisplay').style.display = '';
  } else {
    $('localTimeDisplay').style.display = 'none';
  }
  $('liveDot').style.display = S.mode === 'live' ? 'inline-block' : 'none';
}

async function loadCategories(){
  try{
    const r = await fetch('/api/products');
    categories = await r.json();
  }catch(e){
    // fallback
    categories = [{code:'level',name:'3D Reflectivity',default_product:'M3DL13',
      has_levels:true,level_suffix:'km',
      products:[{code:'M3DL1',name:'0.5 km'},{code:'M3DL7',name:'2.0 km'},{code:'M3DL13',name:'4.0 km'}]},
      {code:'brefls',name:'Base Reflectivity',default_product:'BREF',has_levels:false,
        products:[{code:'BREF',name:'Base Reflectivity'}]}];
  }
  // Set default: Composite Reflectivity (crefls), or loaded from local storage
  const savedCatCode = localStorage.getItem('mrms_category_code') || 'crefls';
  const savedProdCode = localStorage.getItem('mrms_product_code') || 'CREF';

  S.categoryIdx = categories.findIndex(c=>c.code===savedCatCode);
  if(S.categoryIdx<0) S.categoryIdx = categories.findIndex(c=>c.code==='crefls');
  if(S.categoryIdx<0) S.categoryIdx = 0;
  
  const c = cat();
  S.levelIdx = c.products.findIndex(p=>p.code===savedProdCode);
  if(S.levelIdx<0) S.levelIdx = c.products.findIndex(p=>p.code===c.default_product);
  if(S.levelIdx<0) S.levelIdx = 0;

  renderCategorySelect();
  renderLevelSelector();
  updateProductBadge();
}

function renderCategorySelect(){
  const sel = $('categorySelect');
  sel.innerHTML = categories.map((c,i)=>
    `<option value="${i}"${i===S.categoryIdx?' selected':''}>${c.name}</option>`
  ).join('');
  sel.onchange = ()=>{
    S.categoryIdx = parseInt(sel.value);
    const c = cat();
    S.levelIdx = c.products.findIndex(p=>p.code===c.default_product);
    if(S.levelIdx<0) S.levelIdx=0;
    renderLevelSelector();
    updateProductBadge();
    saveSettings();
    fetchImage();
  };

function renderLevelSelector(){
  const c = cat();
  if(!c) return;

  if(c.has_levels){
    $('levelSection').style.display = 'block';
    $('subProductSection').style.display = 'none';

    const slider = $('levelSlider');
    slider.min = 0;
    slider.max = c.products.length - 1;

    slider.oninput = ()=>{
      S.levelIdx = parseInt(slider.value);
      $('levelValue').textContent = c.products[S.levelIdx].name;

    slider.onchange = ()=>{
      updateProductBadge();
      saveSettings();
      fetchImage();
    };

    $('levelValue').textContent = c.products[S.levelIdx].name;
    $('levelMin').textContent = c.products[0].name;
    $('levelMax').textContent = c.products[c.products.length-1].name;

    $('subProductSection').style.display = 'block';

    const sel = $('subProductSelect');
    sel.innerHTML = c.products.map((p,i)=>
      `<option value="${i}"${i===S.levelIdx?' selected':''}>${p.name}</option>`
    ).join('');
    sel.onchange = ()=>{
      S.levelIdx = parseInt(sel.value);
      updateProductBadge();
      saveSettings();
      fetchImage();
    };
  }

function updateTimeLabels(){

  const start = new Date(now.getTime() - SLOTS*2*60000);
  const fmt = d=>`${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
  $('labelStart').textContent = fmt(start);
  $('labelEnd').textContent = S.mode === 'live' ? 'NOW' : fmt(new Date(now.getTime()));
  $('timeSlider').value = SLOTS - S.timeSlot;
}

function stepTime(n){
  stopAnimation();
  S.timeSlot = Math.max(0, Math.min(SLOTS, S.timeSlot + n));
  S.mode = S.timeSlot === 0 ? 'live' : 'paused';
  if(S.mode === 'live') startAutoRefresh();
  $('liveDot').style.display = S.mode === 'live' ? 'inline-block' : 'none';
  updateLivePauseBtn();
  updateTimeLabels();
  fetchImage();
}
function goLive(){
  stopAnimation();

  $('liveDot').style.display = 'inline-block';
  updateLivePauseBtn();
  updateTimeLabels();
  fetchImage();

}
function toggleLivePause(){
  if(S.mode === 'playing'){
    stopAnimation();
  } else {
    startAnimation();
  }
}
function updateLivePauseBtn(){
  $('livePauseBtn').textContent = S.mode === 'playing' ? '⏸' : '⏯';
}
function startAnimation(){
  stopAutoRefresh();
  stopAnimation();
  S.mode = 'playing';
  S.animFrame = 0;
  S.animCache = [];
  $('liveDot').style.display = 'none';
  updateLivePauseBtn();
  preloadAnimFrames().then(()=>{
    if(S.mode !== 'playing') return;
    stepAnimFrame();
    startAnimRefresh();
  });
}
async function preloadAnimFrames(){
  $('animLoading').classList.add('show');
  $('animProgress').textContent = 'Loading radar loop...';
  
  // 1. Fetch sequential slots starting at slot 0 to find the first non-blank image
  let latestTimeStr = '';
  let latestBlob = null;
  let anchorSlot = 0;
  
  for (let slot = 0; slot < 6; slot++) {
    try {
      const r = await fetch(radarUrlForSlot(slot));
      if (r.ok) {
        const blob = await r.blob();
        if (blob.size >= 4000) {
          latestBlob = blob;
          latestTimeStr = r.headers.get('X-MRMS-Timestamp') || '';
          anchorSlot = slot;
          break; // Found a valid non-blank frame!
        } else {
          console.warn(`Slot ${slot} returned a blank image (size: ${blob.size}), checking next slot.`);
        }
      } else {
        console.warn(`Slot ${slot} fetch failed (status: ${r.status}), checking next slot.`);
      }
    } catch (e) {
      console.error(`Failed to fetch slot ${slot} for loop anchor:`, e);
    }
  }
  
  // Fallback to current rounded time minus default latency if search failed
  if (!latestBlob) {
    const d = roundSlot(new Date());
    d.setMinutes(d.getMinutes() - 4); // default latency
    latestTimeStr = d.toISOString().slice(0, 19);
  }
  
  // 2. Parse the latestTime
  const parts = latestTimeStr.split('T');
  const dateParts = parts[0].split('-');
  const timeParts = parts[1].split(':');
  const latestDate = new Date(Date.UTC(
    parseInt(dateParts[0]),
    parseInt(dateParts[1]) - 1,
    parseInt(dateParts[2]),
    parseInt(timeParts[0]),
    parseInt(timeParts[1]),
    0, 0
  ));
  
  const mins = latestDate.getUTCMinutes();
  const isAligned = (mins % 4 === 0);
  
  const fetches = [];
  for (let f = 0; f < ANIM_FRAMES; f++) {
    const i = 17 - f; // i = 0 is newest, i = 17 is oldest
    
    if (i === 0 && latestBlob) {
      fetches.push(Promise.resolve({blob: latestBlob, ts: latestTimeStr}));
      continue;
    }
    
    // Calculate target date for this frame
    let targetDate = new Date(latestDate);
    if (isAligned) {
      targetDate.setMinutes(targetDate.getMinutes() - i * 4);
    } else {
      targetDate.setMinutes(targetDate.getMinutes() - 2 - (i - 1) * 4);
    }
    
    const timeParam = targetDate.toISOString().slice(0,16);
    const p = new URLSearchParams({
      product: prodCode(), lat: S.lat, lon: S.lon, zoom: S.zoom,
      width: 920, height: 630,
      time: timeParam
    });
    const url = '/api/radar?' + p;
    
    fetches.push(
      fetch(url).then(async r => {
        if (!r.ok) return {blob: null, ts: ''};
        const blob = await r.blob();
        if (blob.size < 4000) return {blob: null, ts: ''}; // Skip blank image
        const ts = r.headers.get('X-MRMS-Timestamp') || timeParam + ':00';
        return {blob, ts};
      }).catch(e => {
        console.error('Anim preload error frame ' + f, e);
        return {blob: null, ts: ''};
      })
    );
  }
  
  const results = await Promise.all(fetches);
  S.animCache = results;
  $('animLoading').classList.remove('show');
}
function stopAnimation(){
  if(S.animTimer){ clearTimeout(S.animTimer); S.animTimer = null; }
  stopAnimRefresh();
  if(S.mode === 'playing') S.mode = 'paused';
  updateLivePauseBtn();
  cleanupAnimBlobs();
}
function stepAnimFrame(){
  if(S.mode !== 'playing') return;
  S.timeSlot = MAX_ANIM_SLOT - S.animFrame * ANIM_STEP;
  updateTimeLabels();
  const frame = S.animCache[S.animFrame];
  if(frame && frame.blob){
    updateRadarOverlay(URL.createObjectURL(frame.blob));
    $('mapLoading').classList.add('hidden');
    updateTimeDisplay(frame.ts);
    syncMap();
  }
  S.animFrame = (S.animFrame + 1) % ANIM_FRAMES;
  if(S.mode === 'playing') S.animTimer = setTimeout(stepAnimFrame, ANIM_INTERVAL);
}
function startAnimRefresh(){
  stopAnimRefresh();
  S.animRefreshTimer = setInterval(refreshNewestFrames, 120000);
}
function stopAnimRefresh(){
  if(S.animRefreshTimer){ clearInterval(S.animRefreshTimer); S.animRefreshTimer = null; }
}
async function refreshNewestFrames(){
  if(S.mode !== 'playing') return;
  
  // 1. Fetch sequential slots starting at slot 0 to find the first non-blank image
  let latestTimeStr = '';
  let latestBlob = null;
  
  for (let slot = 0; slot < 6; slot++) {
    try {
      const r = await fetch(radarUrlForSlot(slot));
      if (r.ok) {
        const blob = await r.blob();
        if (blob.size >= 4000) {
          latestBlob = blob;
          latestTimeStr = r.headers.get('X-MRMS-Timestamp') || '';
          break; // Found a valid non-blank frame!
        }
      }
    } catch (e) {
      console.error(`Failed to refresh newest frame at slot ${slot}:`, e);
    }
  }
  
  if (!latestTimeStr || !latestBlob) return;
  
  // Parse latestTime
  const parts = latestTimeStr.split('T');
  const dateParts = parts[0].split('-');
  const timeParts = parts[1].split(':');
  const latestDate = new Date(Date.UTC(
    parseInt(dateParts[0]),
    parseInt(dateParts[1]) - 1,
    parseInt(dateParts[2]),
    parseInt(timeParts[0]),
    parseInt(timeParts[1]),
    0, 0
  ));
  
  const mins = latestDate.getUTCMinutes();
  const isAligned = (mins % 4 === 0);
  
  const newestIdx = [15, 16, 17];
  const fetches = newestIdx.map(idx => {
    const i = 17 - idx; // i = 0 for 17, i = 1 for 16, i = 2 for 15
    if (i === 0) {
      return Promise.resolve({idx, blob: latestBlob, ts: latestTimeStr});
    }
    
    let targetDate = new Date(latestDate);
    if (isAligned) {
      targetDate.setMinutes(targetDate.getMinutes() - i * 4);
    } else {
      targetDate.setMinutes(targetDate.getMinutes() - 2 - (i - 1) * 4);
    }
    
    const timeParam = targetDate.toISOString().slice(0,16);
    const p = new URLSearchParams({
      product: prodCode(), lat: S.lat, lon: S.lon, zoom: S.zoom,
      width: 920, height: 630,
      time: timeParam
    });
    const url = '/api/radar?' + p;
    
    return fetch(url).then(async r => {
      if (!r.ok) return {idx, blob: null, ts: ''};
      const blob = await r.blob();
      if (blob.size < 4000) return {idx, blob: null, ts: ''}; // Skip blank image
      const ts = r.headers.get('X-MRMS-Timestamp') || timeParam + ':00';
      return {idx, blob, ts};
    }).catch(e => ({idx, blob: null, ts: ''}));
  });
  
  const results = await Promise.all(fetches);
  for(const {idx, blob, ts} of results){
    if(blob) S.animCache[idx] = {blob, ts};
  }
}
function cleanupAnimBlobs(){
  S.animCache = [];
}

// Map pan / pinch / wheel (server-side zoom + lat/lon)
// ═══════════════════════════════════════════════════════════════════════════
function changeZoom(delta){
  stopAnimation();
  zoomPending = Math.sign(zoomPending + delta);
  clearTimeout(zoomDebounce);
  zoomDebounce = setTimeout(()=>{
    S.zoom = Math.max(3, Math.min(12, S.zoom + zoomPending));
    zoomPending = 0;
    $('zoomSlider').value = S.zoom;
    syncMap();
    saveSettings();
    fetchImage();
  }, 300);
}

$('mapContainer').addEventListener('mousedown',e=>{
  if(e.target.closest('button,select,input,.floating,.side-panel,.backdrop,.colorbar')) return;
  e.preventDefault(); isDragging=true;
  $('mapContainer').classList.add('dragging');
  dx0 = e.clientX; dy0 = e.clientY;
  dragX = dragY = 0;
});
$('mapContainer').addEventListener('mousemove',e=>{
  if(!isDragging) return; e.preventDefault();
  dragX = e.clientX - dx0;
  dragY = e.clientY - dy0;
});
$('mapContainer').addEventListener('mouseup',()=>{
  if(!isDragging) return;
  onDragEnd();
});
$('mapContainer').addEventListener('mouseleave',()=>{
  if(!isDragging) return;
  onDragEnd();
});

let pinchBase = 0, pinchAccum = 0;
$('mapContainer').addEventListener('touchstart',e=>{
  if(e.target.closest('button,select,input,.floating,.side-panel,.backdrop,.colorbar')) return;
  e.preventDefault();
  if(e.touches.length === 2){
    isDragging = false;
    pinchBase = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    pinchAccum = 0;
    return;
  }
  isDragging = true;
  $('mapContainer').classList.add('dragging');
  dx0 = e.touches[0].clientX; dy0 = e.touches[0].clientY;
  dragX = dragY = 0;
},{passive:false});
$('mapContainer').addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length === 2 && pinchBase > 0){
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    const scale = d / pinchBase;
    if(scale > 1.4){ pinchAccum++; pinchBase = d; }
    if(scale < 0.7){ pinchAccum--; pinchBase = d; }
    if(pinchAccum !== 0){ changeZoom(pinchAccum); pinchAccum = 0; }
    return;
  }
  if(!isDragging) return;
  dragX = e.touches[0].clientX - dx0;
  dragY = e.touches[0].clientY - dy0;
},{passive:false});
$('mapContainer').addEventListener('touchend',()=>{
  if(isDragging) onDragEnd();
  isDragging = false;
  $('mapContainer').classList.remove('dragging');
  pinchBase = 0; pinchAccum = 0;
});
$('mapContainer').addEventListener('dblclick',e=>e.preventDefault());

$('mapContainer').addEventListener('wheel',e=>{
  if(e.target.closest('.side-panel,.floating,.backdrop,.colorbar')) return;
  e.preventDefault();
  changeZoom(e.deltaY < 0 ? 1 : -1);
},{passive:false});

function onDragEnd(){
  isDragging = false;
  $('mapContainer').classList.remove('dragging');
  if(dragX === 0 && dragY === 0) return;
  const degPerPx = 360 / (256 * Math.pow(2, S.zoom));
  S.lon -= dragX * degPerPx;
  S.lat += dragY * degPerPx / Math.cos(S.lat * Math.PI / 180);
  dragX = dragY = 0;
  stopAnimation();
  if(S.mode === 'live') startAutoRefresh();
  syncMap();
  saveSettings();
  fetchImage();
  updateTimezoneIfMoved();
}

function getUserLocation(){
  return new Promise((resolve) => {
    if(!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({lat: pos.coords.latitude, lon: pos.coords.longitude}),
      () => resolve(null),
      {timeout: 5000, maximumAge: 600000}
    );
  });
}
async function fetchTimezone(lat, lon){
  try{
    const r = await fetch(`/api/timezone?lat=${lat.toFixed(3)}&lon=${lon.toFixed(3)}`);
    if(r.ok){
      const data = await r.json();
      S.tz = data;
      S.tzLat = lat; S.tzLon = lon;
      return;
    }
  }catch(e){ /* ignore */ }
  S.tz = null;
}
async function updateTimezoneIfMoved(){
  const moved = Math.abs(S.lat - S.tzLat) > 0.15 || Math.abs(S.lon - S.tzLon) > 0.15;
  if(moved || !S.tz) await fetchTimezone(S.lat, S.lon);
}
function resetView(){
  getUserLocation().then(loc => {
    if(loc){ S.lat = loc.lat; S.lon = loc.lon; }
    S.zoom = 7;
    $('zoomSlider').value = 7;
    dragX = dragY = 0;
    syncMap();
    saveSettings();
    stopAnimation(); fetchImage();
    if(S.mode === 'live') startAutoRefresh();
    updateTimezoneIfMoved();
  });
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closePanel();
  if(e.key==='+'||e.key==='=') changeZoom(1);
  if(e.key==='-') changeZoom(-1);
  if(e.key==='ArrowLeft') stepTime(1);
  if(e.key==='ArrowRight') stepTime(-1);
  if(e.key==='0') resetView();
});

// Leaflet background map
// ═══════════════════════════════════════════════════════════════════════════
let radarOverlay = null;

function initLeaflet(){
  if(leafletMap) return;
  leafletMap = L.map('leafletMap', {
    center: [S.lat, S.lon],
    zoom: S.zoom,
    zoomControl: false,
    attributionControl: false,
    dragging: false,
    touchZoom: false,
    scrollWheelZoom: false,
    doubleClickZoom: false,
    boxZoom: false,
    keyboard: false,
  });
  BASEMAPS[S.baseMap].addTo(leafletMap);
}
function syncMap(){
  if(!leafletMap) return;
  leafletMap.setView([S.lat, S.lon], S.zoom, {animate: false});
}
function switchBaseMap(key){
  if(!leafletMap || key === S.baseMap) return;
  leafletMap.removeLayer(BASEMAPS[S.baseMap]);
  BASEMAPS[key].addTo(leafletMap);
  S.baseMap = key;
  saveSettings();
}
function scaleLeafletMap(){
  const c = $('mapContainer');
  const scale = Math.max(c.clientWidth / 920, c.clientHeight / 630);
  $('leafletMap').style.transform = `translate(-50%,-50%) scale(${scale})`;
}
function getRadarBounds(){
  const px = leafletMap.project([S.lat, S.lon], S.zoom);
  const nw = L.point(px.x - 460, px.y - 315);
  const se = L.point(px.x + 460, px.y + 315);
  return L.latLngBounds(
    leafletMap.unproject(nw, S.zoom),
    leafletMap.unproject(se, S.zoom)
  );
}
function updateRadarOverlay(imageUrl){
  if(!leafletMap) return;
  const bounds = getRadarBounds();
  if(radarOverlay){
    radarOverlay.setUrl(imageUrl);
    radarOverlay.setBounds(bounds);
  } else {
    radarOverlay = L.imageOverlay(imageUrl, bounds, {
      opacity: $('opacitySlider').value / 100,
    }).addTo(leafletMap);
  }
}

$('opacitySlider').oninput = ()=>{
  if(radarOverlay) radarOverlay.setOpacity($('opacitySlider').value / 100);
};
$('baseMapSelect').onchange = ()=>{
  switchBaseMap($('baseMapSelect').value);
};

uct_code:\n                return {\n                    "code": product.get("code"),\n                    "name": product.get("name"),\n                    "min_res_minutes": product.get("min_res_minutes", 2),\n                    "category_code": category.get("code"),\n                    "category_name": category.get("name"),\n                    "has_levels": category.get("has_levels", False),\n                }\n    return None\n\n\n# ---------------------------------------------------------------------------\n# Data model\n# ---------------------------------------------------------------------------\n\n\n@dataclass\nclass RadarImage:\n    """A fetched MRMS radar image with metadata."""\n\n    png_bytes: bytes\n    product: str\n    lat: float\n    lon: float\n    product_name: str = ""\n    zoom: int = 7\n    timestamp: str = ""\n    fetch_time: str = ""\n    source_url: str = ""\n    width: int = 920\n    height: int = 630\n    from_cache: bool = False\n\n    def get_bounds(self) -> tuple[float, float, float, float]:\n        """Return the geographic bounding box (min_lat, max_lat, min_lon, max_lon) for this image."""\n        return get_mercator_bounds(self.lat, self.lon, self.zoom, self.width, self.height)\n\n\n# ---------------------------------------------------------------------------\n# Time utilities\n# ---------------------------------------------------------------------------\n\n\ndef round_to_mrms_window(dt: datetime, resolution_mins: int = 2) -> datetime:\n    """Round a datetime down to the nearest MRMS window for the given resolution."""\n    minute = (dt.minute // resolution_mins) * resolution_mins\n    return dt.replace(minute=minute, second=0, microsecond=0)\n\n\n# ---------------------------------------------------------------------------\n# Spatial utilities\n# ---------------------------------------------------------------------------\n\n\ndef get_mercator_bounds(\n    clat: float, clon: float, zoom: int, width: int, height: int\n) -> tuple[float, float, float, float]:\n    """Calculate the geographic bounding box (min_lat, max_lat, min_lon, max_lon)\n    for a viewport with center (clat, clon), Leaflet zoom level, and pixel dimensions.\n    Uses standard Web Mercator (EPSG:3857) formulas.\n    """\n    import math\n    clat_rad = math.radians(clat)\n    \n    center_x = (clon + 180.0) / 360.0\n    center_y = (1.0 - math.log(math.tan(clat_rad) + 1.0 / math.cos(clat_rad)) / math.pi) / 2.0\n    \n    map_size = 256.0 * (2.0 ** zoom)\n    \n    left_x = (center_x * map_size - (width / 2.0)) / map_size\n    right_x = (center_x * map_size + (width / 2.0)) / map_size\n    top_y = (center_y * map_size - (height / 2.0)) / map_size\n    bottom_y = (center_y * map_size + (height / 2.0)) / map_size\n    \n    def x_to_lon(x):\n        return x * 360.0 - 180.0\n        \n    def y_to_lat(y):\n        val = math.pi * (1.0 - 2.0 * y)\n        lat_rad = 2.0 * math.atan(math.exp(val)) - math.pi / 2.0\n        return math.degrees(lat_rad)\n        \n    return y_to_lat(bottom_y), y_to_lat(top_y), x_to_lon(left_x), x_to_lon(right_x)\n\n\n\n# ---------------------------------------------------------------------------\n# Cache layer\n# ---------------------------------------------------------------------------\n\n\ndef _cache_key(\n    product: str,\n    year: int,\n    month: int,\n    day: int,\n    hour: int,\n    minute: int,\n    lat: float,\n    lon: float,\n    zoom: int,\n    width: int,\n    height: int,\n) -> str:\n    """Build a deterministic cache filename from request parameters."""\n    return (\n        f"{product}_{year:04d}{month:02d}{day:02d}_"\n        f"{hour:02d}{minute:02d}_"\n        f"{lat}_{lon}_{zoom}_"\n        f"{width}x{height}.png"\n    )\n\n\ndef _cache_save(key: str, png_bytes: bytes) -> None:\n    """Save PNG bytes to the cache directory."""\n    os.makedirs(CACHE_DIR, exist_ok=True)\n    path = os.path.join(CACHE_DIR, key)\n    with open(path, "wb") as f:\n        f.write(png_bytes)\n\n\ndef _cache_load(key: str) -> bytes | None:\n    """Load PNG bytes from cache, or None if not cached."""\n    path = os.path.join(CACHE_DIR, key)\n    if os.path.exists(path):\n        with open(path, "rb") as f:\n            return f.read()\n    return None\n\n\n# ---------------------------------------------------------------------------\n# Public API\n# ---------------------------------------------------------------------------\n\n\ndef fetch_radar(\n    product: str = "M3DL13",\n    lat: float = 40.55,\n    lon: float = -104.68,\n    zoom: int = 7,\n    width: int = 920,\n    height: int = 630,\n    year: int | None = None,\n    month: int | None = None,\n    day: int | None = None,\n    hour: int | None = None,\n    minute: int | None = None,\n) -> RadarImage:\n    """Fetch a rendered MRMS radar image from NOAA.\n\n    If *year* is ``None``, the current UTC time (rounded to the nearest\n    2-minute MRMS window) is used.\n    """\n    # --- resolve time -------------------------------------------------------\n    if year is None:\n        meta = get_product_metadata(product)\n        res_mins = meta["min_res_minutes"] if meta else 2\n        now = round_to_mrms_window(datetime.now(timezone.utc), res_mins)\n        # NOAA MRMS has processing latency — adjust back by at least one cycle\n        from datetime import timedelta\n        latency_mins = max(4, res_mins * 2)\n        now = now - timedelta(minutes=latency_mins)\n        year, month, day = now.year, now.month, now.day\n        hour, minute = now.hour, now.minute\n\n\n    # --- fetch from NOAA ----------------------------------------------------\n    from datetime import timedelta\n\n    for attempt in range(6):\n        # Check cache for current timestamp\n        assert year is not None\n        assert month is not None\n        assert day is not None\n        assert hour is not None\n        assert minute is not None\n        key = _cache_key(product, year, month, day, hour, minute,\n                         lat, lon, zoom, width, height)\n        cached = _cache_load(key)\n        if cached is not None:\n            # Check if cached image is blank\n            if len(cached) >= 1024:\n                return RadarImage(\n                    png_bytes=cached,\n                    product=product,\n                    lat=lat,\n                    lon=lon,\n                    zoom=zoom,\n                    width=width,\n                    height=height,\n                    timestamp=f"{year:04d}-{month:02d}-{day:02d}T{hour:02d}:{minute:02d}:00",\n                    fetch_time=datetime.now(timezone.utc).isoformat(),\n                    from_cache=True,\n                )\n\n        # Fetch from NOAA\n        params = {\n            "mode": "run",\n            "cpp_exec_dir": CPP_EXEC_DIR,\n            "web_resources_dir": WEB_RESOURCES_DIR,\n            "prod_root": product,\n            "qperate_pal_option": 0,\n            "qpe_pal_option": 0,\n            "year": year,\n            "month": month,\n            "day": day,\n            "hour": hour,\n            "minute": minute,\n            "clon": lon,\n            "clat": lat,\n            "zoom": zoom,\n            "width": width,\n            "height": height,\n        }\n\n        headers = {\n            "User-Agent": "Mozilla/5.0",\n            "Referer": REFERER,\n        }\n\n        fetch_time = datetime.now(timezone.utc)\n\n        r = requests.get(\n            RENDER_URL, params=params, headers=headers, timeout=30, verify=False\n        )\n        r.raise_for_status()\n\n        # Check if PNG is blank (transparent PNGs <1KB are typically empty)\n        if len(r.content) >= 1024:\n            # Save to cache and return\n            _cache_save(key, r.content)\n\n            # Resolve the actual URL that was fetched (for debugging).\n            req = getattr(r, "request", None)\n            source_url = req.url if req is not None else ""\n\n            return RadarImage(\n                png_bytes=r.content,\n                product=product,\n                lat=lat,\n                lon=lon,\n                zoom=zoom,\n                width=width,\n                height=height,\n                timestamp=f"{year:04d}-{month:02d}-{day:02d}T{hour:02d}:{minute:02d}:00",\n                fetch_time=fetch_time.isoformat(),\n                source_url=source_url,\n                from_cache=False,\n            )\n\n        # Step back 2 minutes and retry\n        dt = datetime(year, month, day, hour, minute, tzinfo=timezone.utc)\n        dt = dt - timedelta(minutes=2)\n        year, month, day = dt.year, dt.month, dt.day\n        hour, minute = dt.hour, dt.minute\n\n    # All attempts failed — return the last (blank) image\n    _cache_save(key, r.content)\n    req = getattr(r, "request", None)\n    source_url = req.url if req is not None else ""\n    return RadarImage(\n        png_bytes=r.content,\n        product=product,\n        lat=lat,\n        lon=lon,\n        zoom=zoom,\n        width=width,\n        height=height,\n        timestamp=f"{year:04d}-{month:02d}-{day:02d}T{hour:02d}:{minute:02d}:00",\n        fetch_time=fetch_time.isoformat(),\n        source_url=source_url,\n        from_cache=False,\n    )\n\n\ndef fetch_legend(product: str) -> str | None:\n    """Fetch the SVG colorbar legend for a given MRMS product.\n\n    Returns the raw SVG string, or ``None`` if the legend is unavailable.\n    Legends are cached on disk since they never change per product.\n    """\n    cache_key = f"legend_{product}.svg"\n    cached = _cache_load(cache_key)\n    if cached is not None:\n        return cached.decode("utf-8")\n\n    params = {\n        "web_resources_dir": WEB_RESOURCES_DIR,\n        "config_name": "title_and_legend_config.txt",\n        "product": product,\n    }\n\n    headers = {\n        "User-Agent": "Mozilla/5.0",\n        "Referer": REFERER,\n    }\n\n    try:\n        r = requests.get(\n            LEGEND_URL, params=params, headers=headers, timeout=15, verify=False\n        )\n        r.raise_for_status()\n    except Exception:\n        return None\n\n    svg = r.text\n    if not svg or "<svg" not in svg:\n        return None\n\n    _cache_save(cache_key, svg.encode("utf-8"))\n    return svg\n',
  "mrms_cli.py": '"""MRMS Radar CLI — fetch NOAA radar imagery from the terminal.\n\nUsage:\n    mrms fetch                              # defaults: M3DL13, Denver, now\n    mrms fetch --product BREF --lat 35 -lon -97 --zoom 5\n    mrms fetch --time 2026-01-15T08:30\n    mrms fetch --width 1200 --height 800 -o ~/Desktop/storm.png\n"""\n\nimport click\nfrom datetime import datetime\n\nfrom mrms_core import fetch_radar, round_to_mrms_window, PRODUCT_CATALOG, get_product_metadata\n\n\n@click.group()\ndef cli():\n    """MRMS Radar — fetch rendered radar imagery from NOAA/NSSL MRMS.\n\n    Default product is M3DL13 (3D Reflectivity at 4.0 km) centered on\n    Denver, CO (40.55, -104.68) at zoom level 7.\n    """\n    pass\n\n\n@cli.command()\n@click.option(\n    "--product", "-p",\n    default="M3DL13",\n    help="MRMS product code (e.g., M3DL13, BREF, CREF, SHSR).",\n)\n@click.option(\n    "--lat",\n    default=40.55,\n    type=float,\n    help="Center latitude (default: 40.55 — Denver, CO).",\n)\n@click.option(\n    "--lon",\n    default=-104.68,\n    type=float,\n    help="Center longitude (default: -104.68 — Denver, CO).",\n)\n@click.option(\n    "--zoom", "-z",\n    default=7,\n    type=int,\n    help="Leaflet zoom level: 3=continent, 7=state, 10=city (default: 7).",\n)\n@click.option(\n    "--width", "-W",\n    default=920,\n    type=int,\n    help="Image width in pixels (default: 920).",\n)\n@click.option(\n    "--height", "-H",\n    default=630,\n    type=int,\n    help="Image height in pixels (default: 630).",\n)\n@click.option(\n    "--time", "-t",\n    default=None,\n    help="Timestamp in ISO 8601 format (e.g., 2026-06-06T16:30). "\n         "Defaults to current UTC time rounded to 2-min MRMS window.",\n)\n@click.option(\n    "--output", "-o",\n    default=None,\n    type=click.Path(dir_okay=False, writable=True),\n    help="Output file path. Defaults to radar_YYYYMMDD_HHMM.png.",\n)\ndef fetch(product, lat, lon, zoom, width, height, time, output):\n    """Fetch a radar image from NOAA MRMS and save it to disk.\n\n    Examples:\\n\n      \\b\n      mrms fetch\n      mrms fetch --product BREF --lat 35.0 --lon -97.0\n      mrms fetch --time 2026-01-15T08:30 -o storm.png\n      mrms fetch --width 1200 --height 800\n    """\n    # Validate product\n    meta = get_product_metadata(product)\n    if meta is None:\n        import difflib\n        all_codes = []\n        for category in PRODUCT_CATALOG:\n            for p in category.get("products", []):\n                all_codes.append(p.get("code"))\n        matches = difflib.get_close_matches(product, all_codes, n=3, cutoff=0.5)\n        \n        click.echo(f"Warning: \'{product}\' is not recognized in the product catalog.", err=True)\n        if matches:\n            click.echo(f"Did you mean one of these? {\', \'.join(matches)}", err=True)\n        else:\n            click.echo("Use \'python mrms_cli.py products\' to list all recognized codes.", err=True)\n\n    # Resolve time\n    if time is not None:\n        dt = datetime.fromisoformat(time)\n        res_mins = meta["min_res_minutes"] if meta else 2\n        dt = round_to_mrms_window(dt, res_mins)\n        year, month, day = dt.year, dt.month, dt.day\n        hour, minute = dt.hour, dt.minute\n        img = fetch_radar(\n            product=product, lat=lat, lon=lon, zoom=zoom,\n            width=width, height=height,\n            year=year, month=month, day=day, hour=hour, minute=minute,\n        )\n    else:\n        img = fetch_radar(\n            product=product, lat=lat, lon=lon, zoom=zoom,\n            width=width, height=height,\n        )\n\n    # Determine output path\n    if output is None:\n        output = (\n            f"radar_"\n            f"{img.timestamp.replace(\'-\', \'\').replace(\':\', \'\').replace(\'T\', \'_\')}"\n            f".png"\n        )\n\n    # Save\n    with open(output, "wb") as f:\n        f.write(img.png_bytes)\n\n    cache_tag = " (cached)" if img.from_cache else ""\n    click.echo(\n        f"Saved {output}  "\n        f"({len(img.png_bytes):,} bytes, {img.width}\\u00d7{img.height})"\n        f"{cache_tag}"\n    )\n\n\n@cli.command()\n@click.option(\n    "--category", "-c",\n    default=None,\n    help="Filter products by category code or name.",\n)\ndef products(category):\n    """List all available MRMS categories and product codes."""\n    if category:\n        cat_lower = category.lower()\n        found = False\n        for cat in PRODUCT_CATALOG:\n            if cat_lower in (cat["code"].lower(), cat["name"].lower()):\n                found = True\n                click.echo(f"\\n{cat[\'name\']} ({cat[\'code\']}):")\n                for p in cat["products"]:\n                    click.echo(f"  {p[\'code\']:15} - {p[\'name\']} ({p[\'min_res_minutes\']} min res)")\n        if not found:\n            click.echo(f"Category \'{category}\' not found.", err=True)\n    else:\n        click.echo("MRMS Categories:")\n        for cat in PRODUCT_CATALOG:\n            click.echo(f"- {cat[\'code\']:12} : {cat[\'name\']}")\n        click.echo("\\nUse \'--category <name>\' to list all specific product codes under a category.")\n\n\nif __name__ == "__main__":\n    cli()\n'

function resolveCorsProxyUrl() {
  const select = document.getElementById('proxy-select') ? document.getElementById('proxy-select').value : 'allorigins';
  if (select === 'none') return '';
  return document.getElementById('cors-proxy') ? document.getElementById('cors-proxy').value : 'https://api.allorigins.win/raw?url=';
}

function getProductMetadata(productCode) {
  for (const cat of categoriesCatalog) {
    for (const prod of cat.products) {
      if (prod.code === productCode) {
        return {
          code: prod.code,
          name: prod.name,
          min_res_minutes: prod.min_res_minutes || 2,
          category_code: cat.code,
          category_name: cat.name,
          has_levels: cat.has_levels
        };
      }
    }
  }
  return null;
}

function roundToMrmsWindow(date, resMins) {
  const roundedMinutes = Math.floor(date.getUTCMinutes() / resMins) * resMins;
  return new Date(Date.UTC(
    date.getUTCFullYear(),
    date.getUTCMonth(),
    date.getUTCDate(),
    date.getUTCHours(),
    roundedMinutes,
    0, 0
  ));
}

function resolveUrl(url) {
  const proxy = resolveCorsProxyUrl();
  
  if (url.startsWith('/api/legend')) {
    const params = new URLSearchParams(url.split('?')[1]);
    const product = params.get('product') || 'M3DL13';
    const noaaUrl = `https://mrms.nssl.noaa.gov/qvs/product_viewer/shared/fetch_svg_legend_via_config.php?web_resources_dir=/var/www/html/qvs/product_viewer/resources/&config_name=title_and_legend_config.txt&product=${product}`;
    return proxy ? proxy + encodeURIComponent(noaaUrl) : noaaUrl;
  }
  
  return url;
}

async function handleRadarFetch(path, init) {
  const params = new URLSearchParams(path.split('?')[1]);
  const productCode = params.get('product') || 'M3DL13';
  const meta = getProductMetadata(productCode);
  const resMins = meta ? meta.min_res_minutes : 2;
  
  // Resolve base time
  let targetDate;
  const timeVal = params.get('time');
  if (timeVal) {
    targetDate = roundToMrmsWindow(new Date(timeVal + 'Z'), resMins);
  } else {
    // Default to now, round, and apply latency offset
    let now = new Date();
    let rounded = roundToMrmsWindow(now, resMins);
    const latencyMins = Math.max(4, resMins * 2);
    rounded.setMinutes(rounded.getMinutes() - latencyMins);
    targetDate = rounded;
  }
  
  const clon = params.get('lon') || S.lon;
  const clat = params.get('lat') || S.lat;
  const zoom = params.get('zoom') || S.zoom;
  const width = params.get('width') || 920;
  const height = params.get('height') || 630;
  
  const proxy = resolveCorsProxyUrl();
  let lastResponse = null;
  let finalDate = new Date(targetDate);
  
  // Try up to 6 times, stepping back by 2 minutes and retrying
  for (let attempt = 0; attempt < 6; attempt++) {
    const p = new URLSearchParams({
      mode: "run",
      cpp_exec_dir: "/home/metop/web/specific/opv/",
      web_resources_dir: "/var/www/html/qvs/product_viewer/resources/",
      prod_root: productCode,
      qperate_pal_option: 0,
      qpe_pal_option: 0,
      clon: clon,
      clat: clat,
      zoom: zoom,
      width: width,
      height: height,
      year: finalDate.getUTCFullYear(),
      month: finalDate.getUTCMonth() + 1,
      day: finalDate.getUTCDate(),
      hour: finalDate.getUTCHours(),
      minute: finalDate.getUTCMinutes()
    });
    
    const noaaUrl = 'https://mrms.nssl.noaa.gov/qvs/product_viewer/local/render_multi_domain_product_layer.php?' + p;
    const requestUrl = proxy ? proxy + encodeURIComponent(noaaUrl) : noaaUrl;
    
    try {
      const response = await originalFetch(requestUrl, init);
      if (response.ok) {
        const blob = await response.blob();
        if (blob.size >= 1024 || attempt === 5) {
          const timestampStr = `${finalDate.getUTCFullYear()}-${String(finalDate.getUTCMonth() + 1).padStart(2,'0')}-${String(finalDate.getUTCDate()).padStart(2,'0')}T${String(finalDate.getUTCHours()).padStart(2,'0')}:${String(finalDate.getUTCMinutes()).padStart(2,'0')}:00`;
          
          const headers = new Headers(response.headers);
          headers.set('X-MRMS-Timestamp', timestampStr);
          headers.set('Access-Control-Expose-Headers', 'X-MRMS-Timestamp');
          
          return new Response(blob, {
            status: response.status,
            statusText: response.statusText,
            headers: headers
          });
        }
      }
      lastResponse = response;
    } catch (err) {
      console.warn(`Attempt ${attempt} failed:`, err);
    }
    
    finalDate.setMinutes(finalDate.getMinutes() - 2);
  }
  
  if (lastResponse) return lastResponse;
  throw new Error("Failed to fetch radar image after 6 attempts");
}

// Hijack fetch globally to intercept local API requests and redirect via CORS proxy
let isStandalone = true;
const originalFetch = window.fetch.bind(window);
const detectPromise = (async () => {
  if (window.location.protocol === 'file:') {
    isStandalone = true;
    return;
  }
  try {
    const r = await originalFetch('/api/products');
    if (r.ok) {
      isStandalone = false;
    }
  } catch (e) {
    isStandalone = true;
  }
})();

window.fetch = async function(input, init) {
  await detectPromise;
  if (!isStandalone) {
    return originalFetch(input, init);
  }
  let url = '';
  if (typeof input === 'string') {
    url = input;
  } else if (input instanceof URL) {
    url = input.href;
  } else if (input && typeof input === 'object') {
    url = input.url || '';
  }
  
  if (url) {
    let path = '';
    try {
      const parsed = new URL(url, window.location.origin);
      path = parsed.pathname + parsed.search;
    } catch(e) {
      path = url;
    }
    
    if (path.startsWith('/api/products')) {
      return Promise.resolve(new Response(JSON.stringify(categoriesCatalog), {
        headers: { 'Content-Type': 'application/json' }
      }));
    }
    
    if (path.startsWith('/api/timezone')) {
      const tzName = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
      const now = new Date();
      const abbr = now.toLocaleDateString('en-US', { day: 'numeric', timeZoneName: 'short' }).split(', ')[1] || 'UTC';
      const offset = -now.getTimezoneOffset() / 60;
      const localTime = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
      
      return Promise.resolve(new Response(JSON.stringify({
        tz: tzName,
        abbr: abbr,
        offset_hours: offset,
        local_time: localTime
      }), {
        headers: { 'Content-Type': 'application/json' }
      }));
    }
    
    if (path.startsWith('/api/radar')) {
      return handleRadarFetch(path, init);
    }
    
    if (path.startsWith('/api/legend')) {
      const resolved = resolveUrl(path);
      if (typeof input === 'string') {
        input = resolved;
      } else if (input instanceof URL) {
        input = new URL(resolved);
      } else if (input && typeof input === 'object') {
        return originalFetch(resolved, init);
      }
    }
  }
  
  return originalFetch(input, init);
};

// ═══════════════════════════════════════════════════════════════════════════
// Terminal & Pyodide WASM Integration
// ═══════════════════════════════════════════════════════════════════════════
let termInstance = null;
let pyodideInstance = null;
let terminalOpen = false;
let pyodideLoading = false;
let currentTermLine = '';

// Expose handlers globally for Python bindings
window.termWrite = (data) => {
  if (termInstance) termInstance.write(data.replace(/\n/g, '\r\n'));
};

window.getCorsProxy = resolveCorsProxyUrl;

window.onPyodideFileGenerated = (filename, bytes) => {
  if (filename.startsWith('radar_') && filename.endsWith('.png')) {
    const blob = new Blob([bytes], { type: 'image/png' });
    const localUrl = URL.createObjectURL(blob);
    
    updateRadarOverlay(localUrl);
    
    try {
      const metaJson = window.pyodideInstance.runPython(`
import json
from mrms_core import get_product_metadata
meta = get_product_metadata(img.product) if 'img' in globals() else None
json.dumps({
    "product": img.product if 'img' in globals() else "",
    "timestamp": img.timestamp if 'img' in globals() else "",
    "lat": img.lat if 'img' in globals() else 0.0,
    "lon": img.lon if 'img' in globals() else 0.0,
    "zoom": img.zoom if 'img' in globals() else 7,
    "product_name": meta["name"] if meta else ""
})
      `);
      const meta = JSON.parse(metaJson);
      if (meta.product) {
        S.zoom = meta.zoom;
        S.lat = meta.lat;
        S.lon = meta.lon;
        
        if (leafletMap) {
          leafletMap.setView([S.lat, S.lon], S.zoom);
        }
        
        if ($('productBadge')) {
          $('productBadge').innerHTML = `<strong>${meta.product_name || meta.product}</strong> (CLI)`;
        }
        
        updateTimeDisplay(meta.timestamp);
      }
    } catch (e) {
      console.error("Failed to sync CLI metadata to Leaflet UI:", e);
    }
    
    if (termInstance) {
      termInstance.write('\r\n\x1b[1;32m[Info] Map dynamically updated from CLI output file: ' + filename + '\x1b[0m\r\n');
    }
  } else {
    const blob = new Blob([bytes], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    link.click();
  }
};

function toggleTerminal() {
  terminalOpen = !terminalOpen;
  const panel = $('terminalPanel');
  if (terminalOpen) {
    panel.classList.add('open');
    if (!termInstance) {
      initTerminal();
    } else {
      termInstance.focus();
    }
  } else {
    panel.classList.remove('open');
  }
}

function initTerminal() {
  if (pyodideLoading) return;
  pyodideLoading = true;
  
  const dot = $('terminalStatusDot');
  const text = $('terminalStatusText');
  dot.className = 'status-dot loading';
  text.innerText = "Loading WASM...";
  
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css';
  document.head.appendChild(link);
  
  const scriptXterm = document.createElement('script');
  scriptXterm.src = 'https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js';
  document.head.appendChild(scriptXterm);
  
  const scriptPyodide = document.createElement('script');
  scriptPyodide.src = 'https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js';
  document.head.appendChild(scriptPyodide);
  
  scriptPyodide.onload = async () => {
    if (typeof Terminal === 'undefined') {
      await new Promise(resolve => scriptXterm.onload = resolve);
    }
    
    termInstance = new Terminal({
      cursorBlink: true,
      fontFamily: 'Fira Code, Courier New, monospace',
      fontSize: 12,
      theme: {
        background: '#0d1117',
        foreground: '#c9d1d9',
        cursor: '#58a6ff'
      }
    });
    termInstance.open(document.getElementById('terminal-body'));
    termInstance.writeln("=== MRMS Browser Console ===");
    termInstance.writeln("Loading Python WebAssembly runtime...");
    
    try {
      window.pyodideInstance = await loadPyodide();
      
      text.innerText = "Installing Packages...";
      termInstance.writeln("Installing dependencies (click, requests, pyodide-http)...");
      
      await window.pyodideInstance.loadPackage(["requests", "micropip"]);
      const micropip = window.pyodideInstance.pyimport("micropip");
      await micropip.install("click");
      await micropip.install("pyodide-http");
      
      text.innerText = "Syncing Codebase...";
      termInstance.writeln("Mounting application files in virtual FS...");
      
      for (const [filename, content] of Object.entries(fileCatalog)) {
        window.pyodideInstance.FS.writeFile(filename, content);
      }
      
      termInstance.writeln("Setting up network bridges...");
      
      await window.pyodideInstance.runPythonAsync(`
import pyodide_http
pyodide_http.patch_all()

import requests
original_get = requests.get

def local_proxy_get(url, *args, **kwargs):
    import js
    proxy = js.getCorsProxy()
    if proxy and "mrms.nssl.noaa.gov" in url:
        url = proxy + url
    kwargs['verify'] = False
    return original_get(url, *args, **kwargs)

requests.get = local_proxy_get
      `);
      
      dot.className = 'status-dot ready';
      text.innerText = "Console Ready";
      
      termInstance.clear();
      termInstance.writeln("=== MRMS Interactive Web Console ===");
      termInstance.writeln("Type CLI commands directly. Image outputs will update the Leaflet map!");
      termInstance.writeln("Type \x1b[1;33mmrms fetch --help\x1b[0m or \x1b[1;33mmrms products\x1b[0m to list options.");
      showTermPrompt();
      
      termInstance.onData(data => {
        const code = data.charCodeAt(0);
        if (code === 13) {
          termInstance.write('\r\n');
          handleTermCommand(currentTermLine);
          currentTermLine = '';
        } else if (code === 127 || code === 8) {
          if (currentTermLine.length > 0) {
            currentTermLine = currentTermLine.slice(0, -1);
            termInstance.write(' ');
          }
        } else if (code === 3) {
          termInstance.write('^C\r\n');
          currentTermLine = '';
          showTermPrompt();
        } else if (code >= 32) {
          currentTermLine += data;
          termInstance.write(data);
        }
      });
      termInstance.focus();
      
    } catch (e) {
      dot.className = 'status-dot';
      text.innerText = "Load Failed";
      termInstance.writeln("\x1b[1;31mInitialization Error: " + e.message + "\x1b[0m");
    }
  };
}

function showTermPrompt() {
  if (termInstance) termInstance.write('\r\nmrms> ');
}

async function handleTermCommand(cmdLine) {
  const trimmed = cmdLine.trim();
  if (!trimmed) {
    showTermPrompt();
    return;
  }
  
  const args = trimmed.split(/\s+/);
  const cmdName = args[0];
  
  if (cmdName === 'mrms' || (cmdName === 'python' && args[1] === 'mrms_cli.py')) {
    const finalArgs = cmdName === 'mrms' ? args.slice(1) : args.slice(2);
    window.pyodideInstance.globals.set("cli_args", finalArgs);
    
    try {
      termInstance.write('\x1b[1;30mRunning CLI command...\x1b[0m\r\n');
      
      await window.pyodideInstance.runPythonAsync(`
import sys
from mrms_cli import cli

old_stdout = sys.stdout
old_stderr = sys.stderr

class JSWriter:
    def write(self, data):
        import js
        js.termWrite(data)
    def flush(self):
        pass

sys.stdout = JSWriter()
sys.stderr = JSWriter()

try:
    args_list = list(cli_args)
    global img
    cli.main(args=args_list, standalone_mode=False)
except Exception as e:
    sys.stderr.write(f"Error: {e}\\n")
finally:
    sys.stdout = old_stdout
    sys.stderr = old_stderr
      `);
      
      await window.pyodideInstance.runPythonAsync(`
import os
import js
files = os.listdir('.')
for f in files:
    if f.startswith('radar_') and f.endswith('.png'):
        try:
            with open(f, 'rb') as file_obj:
                data = file_obj.read()
                js.onPyodideFileGenerated(f, bytes(data))
            os.remove(f)
        except Exception as e:
            js.termWrite(f"Map Redraw Error: {e}\\n")
      `);
      
    } catch (e) {
      termInstance.writeln("\x1b[1;31mException: " + e.message + "\x1b[0m");
    }
  } else if (cmdName === 'clear') {
    termInstance.clear();
  } else if (cmdName === 'help') {
    termInstance.writeln("Available commands:");
    termInstance.writeln("  \x1b[1;33mmrms fetch [options]\x1b[0m         - Fetch a radar image (updates the Leaflet map)");
    termInstance.writeln("  \x1b[1;33mmrms products [options]\x1b[0m      - List categories and products");
    termInstance.writeln("  \x1b[1;33mclear\x1b[0m                        - Clear terminal screen");
    termInstance.writeln("  \x1b[1;33mhelp\x1b[0m                         - Show this help message");
  } else {
    termInstance.writeln(`command not found: ${cmdName}`);
  }
  showTermPrompt();
}

init();
