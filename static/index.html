<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/static/manifest.json">
<title>MRMS Radar</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --panel-bg:rgba(18,20,26,.94);
    --panel-border:rgba(255,255,255,.06);
    --text:#e8eaed;
    --text-muted:#8b9098;
    --accent:#5b9ef5;
    --danger:#f0625c;
    --radius:14px;
    --blur:18px;
  }

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#0d1117;
    color:var(--text);
    overflow:hidden;
    height:100dvh;width:100vw;
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
  }

  /* ── Map ── */
  .map-container{
    position:fixed;inset:0;
    overflow:hidden;
    cursor:grab;
    background:#0a0e14;
  }
  .map-container:active,.map-container.dragging{cursor:grabbing}

  .map-image{
    position:absolute;
    transform-origin:0 0;
    will-change:transform;
    opacity:0;transition:opacity .25s;
    width:920px;height:630px;
    background:#111;
    box-shadow:0 0 0 2px rgba(255,255,255,.05);
  }
  .map-image.loaded{opacity:1}

  .map-loading,.map-error{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:12px;
    z-index:10;transition:opacity .25s;
  }
  .map-loading{color:var(--text-muted);font-size:14px;pointer-events:none}
  .map-loading.hidden{opacity:0}
  .map-error{display:none;color:var(--danger);font-size:14px;text-align:center;
    background:rgba(0,0,0,.7);padding:24px 32px;border-radius:12px;max-width:300px}
  .map-error.show{display:flex}

  .spinner{
    width:28px;height:28px;
    border:3px solid rgba(255,255,255,.1);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── Floating panels ── */
  .floating{
    position:fixed;
    background:var(--panel-bg);
    backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    z-index:100;
    transition:opacity .3s,transform .3s;
  }

  /* ── Top bar ── */
  .top-bar{
    top:max(12px,env(safe-area-inset-top));
    left:12px;right:12px;
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 14px;
    opacity:1;transform:translateY(0);
  }
  .top-bar.hidden{opacity:0;transform:translateY(-120%);pointer-events:none}

  .icon-btn{
    width:38px;height:38px;border-radius:50%;border:none;
    background:transparent;color:var(--text);font-size:18px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.06)}
  .icon-btn:active{background:rgba(255,255,255,.12)}

  .brand{font-size:14px;font-weight:600;letter-spacing:.4px}
  .brand span{color:var(--accent)}

  /* ── Side panel ── */
  .side-panel{
    position:fixed;top:0;left:0;bottom:0;
    width:min(340px,88vw);
    background:rgba(14,16,22,.97);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border-right:1px solid var(--panel-border);
    z-index:200;
    padding:max(18px,env(safe-area-inset-top)) 18px 18px;
    transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    overflow-y:auto;
    display:flex;flex-direction:column;gap:20px;
  }
  .side-panel.open{transform:translateX(0)}

  .panel-header{display:flex;align-items:center;justify-content:space-between}
  .panel-header h2{font-size:18px;font-weight:600}

  .section-label{
    font-size:10px;text-transform:uppercase;letter-spacing:1.2px;
    color:var(--text-muted);margin-bottom:6px;
  }

  /* Select styling */
  select{
    width:100%;background:rgba(255,255,255,.05);
    border:1px solid var(--panel-border);border-radius:10px;
    color:var(--text);padding:12px 14px;font-size:14px;outline:none;
    -webkit-appearance:none;appearance:none;
    cursor:pointer;
  }
  select option{background:#181a22;color:var(--text)}

  /* Level slider */
  .level-slider-wrap{margin-top:4px}
  .level-value{
    text-align:center;font-size:24px;font-weight:300;
    color:var(--accent);margin-bottom:4px;
  }
  input[type=range]{
    width:100%;-webkit-appearance:none;
    height:4px;background:rgba(255,255,255,.1);
    border:none;border-radius:2px;outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:24px;height:24px;border-radius:50%;
    background:var(--accent);cursor:pointer;
    box-shadow:0 0 16px rgba(91,158,245,.4);
  }
  .level-labels{
    display:flex;justify-content:space-between;
    font-size:10px;color:var(--text-muted);margin-top:2px;
  }

  /* Toggle rows */
  .toggle-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 0;font-size:14px;
    border-bottom:1px solid rgba(255,255,255,.04);
  }
  .toggle{
    width:44px;height:24px;background:rgba(255,255,255,.1);
    border-radius:12px;position:relative;cursor:pointer;
    transition:background .2s;flex-shrink:0;
  }
  .toggle.on{background:var(--accent)}
  .toggle::after{
    content:"";position:absolute;top:2px;left:2px;
    width:20px;height:20px;border-radius:50%;
    background:#fff;transition:transform .2s;
  }
  .toggle.on::after{transform:translateX(20px)}

  .backdrop{
    position:fixed;inset:0;z-index:150;
    background:rgba(0,0,0,.45);
    opacity:0;pointer-events:none;transition:opacity .28s;
  }
  .backdrop.show{opacity:1;pointer-events:auto}

  /* ── Bottom bar ── */
  .bottom-bar{
    bottom:max(16px,env(safe-area-inset-bottom));
    left:50%;transform:translateX(-50%);
    padding:12px 18px;
    display:flex;flex-direction:column;gap:10px;
    min-width:min(420px,92vw);
  }

  /* Current product badge */
  .product-badge{
    display:flex;align-items:center;gap:8px;
    font-size:12px;color:var(--text-muted);
  }
  .product-badge strong{color:var(--text);font-weight:500}

  /* Time */
  .time-controls{display:flex;align-items:center;gap:10px}
  .time-nav{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--panel-border);
    background:rgba(255,255,255,.05);color:var(--text);
    font-size:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:background .15s;
  }
  .time-nav:hover{background:rgba(255,255,255,.1)}
  .time-nav.now-btn{width:auto;padding:0 12px;border-radius:16px;font-size:11px;font-weight:700}

  .time-display{
    text-align:center;font-size:28px;font-weight:300;letter-spacing:-.5px;
    font-variant-numeric:tabular-nums;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .live-dot{
    display:inline-block;width:7px;height:7px;
    background:var(--danger);border-radius:50%;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  .time-slider-wrap{flex:1;min-width:0}
  .time-labels{
    display:flex;justify-content:space-between;
    font-size:10px;color:var(--text-muted);margin-top:2px;
  }

  /* ── Zoom stack (desktop) ── */
  .zoom-stack{
    position:fixed;right:12px;top:50%;transform:translateY(-50%);
    z-index:100;display:flex;flex-direction:column;gap:4px;
  }
  .zoom-btn{
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--panel-border);
    background:var(--panel-bg);backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
    color:var(--text);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  /* ── Responsive ── */
  @media(max-width:640px){
    .brand{display:none}
    .bottom-bar{min-width:auto;left:12px;right:12px;transform:none;padding:10px 14px}
    .time-display{font-size:22px}
    .side-panel{width:100vw}
    .zoom-stack{right:6px;gap:2px}
    .zoom-btn{width:30px;height:30px;font-size:16px}
    .level-value{font-size:20px}
  }
</style>
</head>
<body>

<!-- Map -->
<div class="map-container" id="mapContainer">
  <img class="map-image" id="mapImage" alt="MRMS Radar" draggable="false"
       onerror="document.getElementById('mapLoading').classList.add('hidden');
                document.getElementById('mapError').classList.add('show');">
  <div class="map-loading" id="mapLoading">
    <div class="spinner"></div>
    <span>Loading radar...</span>
  </div>
  <div class="map-error" id="mapError">
    <span style="font-size:40px">⚠</span>
    <span>Failed to load radar image</span>
    <span style="font-size:11px;opacity:.7">Check that the server is running</span>
  </div>
</div>

<!-- Backdrop -->
<div class="backdrop" id="backdrop" onclick="closePanel()"></div>

<!-- Side panel -->
<div class="side-panel" id="sidePanel">
  <div class="panel-header">
    <h2>MRMS <span style="color:var(--accent)">Radar</span></h2>
    <button class="icon-btn" onclick="closePanel()">✕</button>
  </div>

  <!-- Category -->
  <div>
    <div class="section-label">Product</div>
    <select id="categorySelect"></select>
  </div>

  <!-- Level sub-selector (shown for 3D products) -->
  <div id="levelSection" style="display:none">
    <div class="section-label">Altitude</div>
    <div class="level-slider-wrap">
      <div class="level-value" id="levelValue">4.0 km</div>
      <input type="range" id="levelSlider">
      <div class="level-labels">
        <span id="levelMin">0.5 km</span>
        <span id="levelMax">19 km</span>
      </div>
    </div>
  </div>

  <!-- Sub-product selector (for non-level categories) -->
  <div id="subProductSection" style="display:none">
    <div class="section-label">Variant</div>
    <select id="subProductSelect"></select>
  </div>

  <!-- Zoom -->
  <div>
    <div class="section-label">Zoom Level</div>
    <input type="range" min="3" max="12" value="7" id="zoomSlider">
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted)">
      <span>Continent</span><span>State</span><span>City</span>
    </div>
  </div>

  <!-- Overlays -->
  <div>
    <div class="section-label">Overlays</div>
    <div class="toggle-row">
      <span>State Borders</span>
      <div class="toggle on" onclick="this.classList.toggle('on')"></div>
    </div>
    <div class="toggle-row">
      <span>County Lines</span>
      <div class="toggle" onclick="this.classList.toggle('on')"></div>
    </div>
    <div class="toggle-row">
      <span>Highways</span>
      <div class="toggle" onclick="this.classList.toggle('on')"></div>
    </div>
    <div class="toggle-row">
      <span>Auto-Refresh (2 min)</span>
      <div class="toggle on" id="toggleAutoRefreshEl" onclick="toggleAutoRefresh()"></div>
    </div>
  </div>
</div>

<!-- Top bar -->
<div class="floating top-bar" id="topBar">
  <div style="display:flex;align-items:center;gap:4px">
    <button class="icon-btn" onclick="openPanel()">☰</button>
    <span class="brand">MRMS <span>Radar</span></span>
  </div>
  <div style="display:flex;align-items:center;gap:4px">
    <span style="font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums" id="headerTime">--:-- UTC</span>
    <button class="icon-btn" onclick="resetView()" title="Reset view">⌂</button>
  </div>
</div>

<!-- Zoom -->
<div class="zoom-stack">
  <button class="zoom-btn" onclick="zoomIn()">+</button>
  <button class="zoom-btn" onclick="zoomOut()">−</button>
</div>

<!-- Bottom bar -->
<div class="floating bottom-bar">
  <div class="product-badge" id="productBadge">
    <strong>Refl</strong> 4.0 km
  </div>

  <div class="time-display">
    <span class="live-dot" id="liveDot"></span>
    <span id="timeDisplay">--:--</span>
  </div>

  <div class="time-controls">
    <button class="time-nav" onclick="stepTime(-4)" title="-8 min">◀◀</button>
    <button class="time-nav" onclick="stepTime(-1)" title="-2 min">◀</button>
    <div class="time-slider-wrap">
      <input type="range" min="0" max="48" value="48" id="timeSlider">
      <div class="time-labels">
        <span id="labelStart">--:--</span>
        <span id="labelEnd">NOW</span>
      </div>
    </div>
    <button class="time-nav" onclick="stepTime(1)" title="+2 min">▶</button>
    <button class="time-nav" onclick="stepTime(4)" title="+8 min">▶▶</button>
    <button class="time-nav now-btn" onclick="goLive()">NOW</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// Service Worker
// ═══════════════════════════════════════════════════════════════════════════
if('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js');

// ═══════════════════════════════════════════════════════════════════════════
// Shortcuts (must be defined before any usage)
// ═══════════════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);

// ═══════════════════════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════════════════════
const S = {
  categoryIdx: 0,      // index into categories[]
  levelIdx: 12,         // index into category.products[] (M3DL13 = index 12)
  zoom: 7,
  lat: 40.55, lon: -104.68,
  timeSlot: 0, isLive: true,
  imgZoom: 1.5, offsetX: 0, offsetY: 0,
  autoRefresh: true, refreshTimer: null,
};
const SLOTS = 48;
let categories = [];
let hideTimer = null;

// ═══════════════════════════════════════════════════════════════════════════
// Derived
// ═══════════════════════════════════════════════════════════════════════════
function cat()    { return categories[S.categoryIdx]; }
function product(){ return cat() ? cat().products[S.levelIdx] : null; }
function prodCode(){ const p = product(); return p ? p.code : 'M3DL13'; }

// ═══════════════════════════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════════════════════════
function radarUrl(meta=false){
  const p = new URLSearchParams({
    product: prodCode(), lat: S.lat, lon: S.lon, zoom: S.zoom,
    width: 920, height: 630,
  });
  if(!S.isLive){
    const d = roundSlot(new Date());
    d.setMinutes(d.getMinutes() - S.timeSlot * 2);
    p.set('time', d.toISOString().slice(0,16));
  }
  if(meta) p.set('meta','true');
  return '/api/radar?'+p;
}
function roundSlot(d){
  const m = Math.floor(d.getMinutes()/2)*2;
  return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours(),m,0,0));
}

async function fetchImage(){
  const url = radarUrl();
  $('mapLoading').classList.remove('hidden');
  $('mapError').classList.remove('show');
  $('mapImage').classList.remove('loaded');
  try{
    const r = await fetch(url);
    if(!r.ok) throw Error('HTTP '+r.status);
    const blob = await r.blob();
    if($('mapImage').src.startsWith('blob:')) URL.revokeObjectURL($('mapImage').src);
    $('mapImage').src = URL.createObjectURL(blob);
    $('mapImage').onload = ()=>{
      $('mapImage').classList.add('loaded');
      $('mapLoading').classList.add('hidden');
    };
    const ts = r.headers.get('X-MRMS-Timestamp')||'';
    updateTimeDisplay(ts);
  }catch(e){
    console.error(e);
    $('mapLoading').querySelector('span').textContent='Retrying...';
    setTimeout(fetchImage,3000);
  }
}

function updateTimeDisplay(ts){
  const parts = ts.split('T');
  if(parts.length<2) return;
  const t = parts[1].slice(0,5);
  $('timeDisplay').textContent = t;
  $('headerTime').textContent = t+' UTC';
  $('liveDot').style.display = S.isLive ? 'inline-block' : 'none';
}

// ═══════════════════════════════════════════════════════════════════════════
// Product catalog loading
// ═══════════════════════════════════════════════════════════════════════════
async function loadCategories(){
  try{
    const r = await fetch('/api/products');
    categories = await r.json();
  }catch(e){
    // fallback
    categories = [{code:'level',name:'3D Reflectivity',default_product:'M3DL13',
      has_levels:true,level_suffix:'km',
      products:[{code:'M3DL1',name:'0.5 km'},{code:'M3DL7',name:'2.0 km'},{code:'M3DL13',name:'4.0 km'}]},
      {code:'brefls',name:'Base Reflectivity',default_product:'BREF',has_levels:false,
        products:[{code:'BREF',name:'Base Reflectivity'}]}];
  }
  // Set default: 3D Reflectivity, level index 12 (4.0 km)
  S.categoryIdx = categories.findIndex(c=>c.code==='level');
  if(S.categoryIdx<0) S.categoryIdx=0;
  const c = cat();
  S.levelIdx = c.products.findIndex(p=>p.code===c.default_product);
  if(S.levelIdx<0) S.levelIdx=0;

  renderCategorySelect();
  renderLevelSelector();
  updateProductBadge();
}

function renderCategorySelect(){
  const sel = $('categorySelect');
  sel.innerHTML = categories.map((c,i)=>
    `<option value="${i}"${i===S.categoryIdx?' selected':''}>${c.name}</option>`
  ).join('');
  sel.onchange = ()=>{
    S.categoryIdx = parseInt(sel.value);
    const c = cat();
    S.levelIdx = c.products.findIndex(p=>p.code===c.default_product);
    if(S.levelIdx<0) S.levelIdx=0;
    renderLevelSelector();
    updateProductBadge();
    fetchImage();
  };
}

function renderLevelSelector(){
  const c = cat();
  if(!c) return;

  if(c.has_levels){
    $('levelSection').style.display = 'block';
    $('subProductSection').style.display = 'none';

    const slider = $('levelSlider');
    slider.min = 0;
    slider.max = c.products.length - 1;
    slider.value = S.levelIdx;
    slider.oninput = ()=>{
      S.levelIdx = parseInt(slider.value);
      $('levelValue').textContent = c.products[S.levelIdx].name;
    };
    slider.onchange = ()=>{
      updateProductBadge();
      fetchImage();
    };

    $('levelValue').textContent = c.products[S.levelIdx].name;
    $('levelMin').textContent = c.products[0].name;
    $('levelMax').textContent = c.products[c.products.length-1].name;
  } else {
    $('levelSection').style.display = 'none';
    $('subProductSection').style.display = 'block';

    const sel = $('subProductSelect');
    sel.innerHTML = c.products.map((p,i)=>
      `<option value="${i}"${i===S.levelIdx?' selected':''}>${p.name}</option>`
    ).join('');
    sel.onchange = ()=>{
      S.levelIdx = parseInt(sel.value);
      updateProductBadge();
      fetchImage();
    };
  }
}

function updateProductBadge(){
  const c = cat();
  const p = product();
  if(!c||!p) return;
  $('productBadge').innerHTML = `<strong>${c.name}</strong> ${p.name}`;
}

// ═══════════════════════════════════════════════════════════════════════════
// Time
// ═══════════════════════════════════════════════════════════════════════════
function updateTimeLabels(){
  const now = roundSlot(new Date());
  const start = new Date(now.getTime() - SLOTS*2*60000);
  const fmt = d=>`${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
  $('labelStart').textContent = fmt(start);
  $('labelEnd').textContent = S.isLive ? 'NOW' : fmt(new Date(now.getTime()));
  $('timeSlider').value = SLOTS - S.timeSlot;
}

function stepTime(n){
  S.timeSlot = Math.max(0, Math.min(SLOTS, S.timeSlot + n));
  S.isLive = S.timeSlot===0;
  $('liveDot').style.display = S.isLive?'inline-block':'none';
  updateTimeLabels();
  fetchImage();
}
function goLive(){
  S.timeSlot = 0; S.isLive = true;
  $('liveDot').style.display = 'inline-block';
  updateTimeLabels();
  fetchImage();
}
$('timeSlider').oninput = ()=>{
  S.timeSlot = SLOTS - parseInt($('timeSlider').value);
  S.isLive = S.timeSlot===0;
  $('liveDot').style.display = S.isLive?'inline-block':'none';
  updateTimeLabels();
};
$('timeSlider').onchange = ()=> fetchImage();

// ═══════════════════════════════════════════════════════════════════════════
// Zoom (NOAA level)
// ═══════════════════════════════════════════════════════════════════════════
$('zoomSlider').onchange = ()=>{ S.zoom = parseInt($('zoomSlider').value); fetchImage(); };

// ═══════════════════════════════════════════════════════════════════════════
// Auto-refresh
// ═══════════════════════════════════════════════════════════════════════════
function toggleAutoRefresh(){
  S.autoRefresh = !S.autoRefresh;
  S.autoRefresh ? startAutoRefresh() : stopAutoRefresh();
}
function startAutoRefresh(){
  stopAutoRefresh();
  S.refreshTimer = setInterval(()=>{ if(S.isLive) fetchImage(); }, 120000);
}
function stopAutoRefresh(){
  if(S.refreshTimer){ clearInterval(S.refreshTimer); S.refreshTimer = null; }
}

// ═══════════════════════════════════════════════════════════════════════════
// Map pan / pinch / wheel
// ═══════════════════════════════════════════════════════════════════════════
let isDragging,dx0,dy0,ox0,oy0,lastD;
function applyT(){
  $('mapImage').style.transform = `translate(${S.offsetX}px,${S.offsetY}px) scale(${S.imgZoom})`;
}
function centerMap(){
  const cw = $('mapContainer').clientWidth, ch = $('mapContainer').clientHeight;
  S.offsetX = (cw - 920*S.imgZoom)/2;
  S.offsetY = (ch - 630*S.imgZoom)/2;
  applyT();
}

$('mapContainer').addEventListener('mousedown',e=>{
  if(e.target.closest('button,select,input,.floating,.side-panel,.backdrop,.zoom-stack')) return;
  e.preventDefault(); isDragging=true;
  $('mapContainer').classList.add('dragging');
  dx0=e.clientX;dy0=e.clientY;ox0=S.offsetX;oy0=S.offsetY;
});
$('mapContainer').addEventListener('mousemove',e=>{
  if(!isDragging) return; e.preventDefault();
  S.offsetX=ox0+(e.clientX-dx0); S.offsetY=oy0+(e.clientY-dy0);
  applyT(); showTopBar();
});
$('mapContainer').addEventListener('mouseup',()=>{isDragging=false;$('mapContainer').classList.remove('dragging');resetHideTimer()});
$('mapContainer').addEventListener('mouseleave',()=>{isDragging=false;$('mapContainer').classList.remove('dragging')});

$('mapContainer').addEventListener('touchstart',e=>{
  if(e.target.closest('button,select,input,.floating,.side-panel,.backdrop,.zoom-stack')) return;
  e.preventDefault(); isDragging=true;
  $('mapContainer').classList.add('dragging');
  dx0=e.touches[0].clientX;dy0=e.touches[0].clientY;ox0=S.offsetX;oy0=S.offsetY;
  if(e.touches.length===2) lastD = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
},{passive:false});
$('mapContainer').addEventListener('touchmove',e=>{
  if(!isDragging) return; e.preventDefault();
  if(e.touches.length===2){
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if(lastD>0){
      const s = d/lastD, nz = Math.max(.4,Math.min(8,S.imgZoom*s));
      const mx=(e.touches[0].clientX+e.touches[1].clientX)/2, my=(e.touches[0].clientY+e.touches[1].clientY)/2;
      S.offsetX = mx - (mx-S.offsetX)*(nz/S.imgZoom);
      S.offsetY = my - (my-S.offsetY)*(nz/S.imgZoom);
      S.imgZoom = nz;
    }
    lastD=d; applyT(); return;
  }
  S.offsetX=ox0+(e.touches[0].clientX-dx0); S.offsetY=oy0+(e.touches[0].clientY-dy0);
  applyT(); showTopBar();
},{passive:false});
$('mapContainer').addEventListener('touchend',()=>{isDragging=false;$('mapContainer').classList.remove('dragging');lastD=0;resetHideTimer()});
$('mapContainer').addEventListener('dblclick',e=>e.preventDefault());

$('mapContainer').addEventListener('wheel',e=>{
  if(e.target.closest('.side-panel,.floating,.backdrop,.zoom-stack')) return;
  e.preventDefault();
  const r = $('mapContainer').getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const f = e.deltaY<0?1.15:1/1.15;
  const nz = Math.max(.4,Math.min(8,S.imgZoom*f));
  S.offsetX = mx - (mx-S.offsetX)*(nz/S.imgZoom);
  S.offsetY = my - (my-S.offsetY)*(nz/S.imgZoom);
  S.imgZoom=nz; applyT(); showTopBar();
},{passive:false});

function zoomIn(){
  const cx=$('mapContainer').clientWidth/2, cy=$('mapContainer').clientHeight/2;
  const nz=Math.min(8,S.imgZoom*1.4);
  S.offsetX=cx-(cx-S.offsetX)*(nz/S.imgZoom); S.offsetY=cy-(cy-S.offsetY)*(nz/S.imgZoom);
  S.imgZoom=nz; applyT();
}
function zoomOut(){
  const cx=$('mapContainer').clientWidth/2, cy=$('mapContainer').clientHeight/2;
  const nz=Math.max(.4,S.imgZoom/1.4);
  S.offsetX=cx-(cx-S.offsetX)*(nz/S.imgZoom); S.offsetY=cy-(cy-S.offsetY)*(nz/S.imgZoom);
  S.imgZoom=nz; applyT();
}

// ═══════════════════════════════════════════════════════════════════════════
// Side panel
// ═══════════════════════════════════════════════════════════════════════════
function openPanel(){ $('sidePanel').classList.add('open'); $('backdrop').classList.add('show'); }
function closePanel(){ $('sidePanel').classList.remove('open'); $('backdrop').classList.remove('show'); }

// ═══════════════════════════════════════════════════════════════════════════
// Top bar auto-hide
// ═══════════════════════════════════════════════════════════════════════════
function showTopBar(){ $('topBar').classList.remove('hidden'); resetHideTimer(); }
function hideTopBar(){ if(!$('sidePanel').classList.contains('open')) $('topBar').classList.add('hidden'); }
function resetHideTimer(){ clearTimeout(hideTimer); hideTimer = setTimeout(hideTopBar, 4000); }

// ═══════════════════════════════════════════════════════════════════════════
// Helpers
// ═══════════════════════════════════════════════════════════════════════════
function resetView(){ S.imgZoom=1.5; centerMap(); showTopBar(); }

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closePanel();
  if(e.key==='+'||e.key==='=') zoomIn();
  if(e.key==='-') zoomOut();
  if(e.key==='ArrowLeft') stepTime(1);
  if(e.key==='ArrowRight') stepTime(-1);
  if(e.key==='0') resetView();
});

// ═══════════════════════════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════════════════════════
async function init(){
  await loadCategories();
  centerMap(); resetHideTimer(); updateTimeLabels();
  fetchImage(); startAutoRefresh();
}
window.addEventListener('resize', centerMap);
init();
</script>
