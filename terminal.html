<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRMS Web Terminal</title>
    <!-- xterm.js styles and scripts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .title-area h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        .status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            background-color: #21262d;
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status.ready {
            background-color: rgba(56, 139, 253, 0.15);
            color: #58a6ff;
            border: 1px solid rgba(56, 139, 253, 0.4);
        }

        .spinner {
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .controls label {
            font-size: 12px;
            color: #8b949e;
        }

        .controls input, .controls select {
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
        }

        .controls input {
            width: 250px;
        }

        #terminal-container {
            flex: 1;
            padding: 10px;
            background-color: #0d1117;
            position: relative;
        }

        .xterm {
            height: 100%;
        }
    </style>
</head>
<body>

<header>
    <div class="title-area">
        <h1>MRMS Web Terminal</h1>
        <div class="status" id="status-badge">
            <div class="spinner" id="status-spinner"></div>
            <span id="status-text">Loading WebAssembly...</span>
        </div>
    </div>
    <div class="controls">
        <label for="cors-proxy">CORS Proxy:</label>
        <select id="proxy-select" onchange="toggleProxyInput()">
            <option value="allorigins">AllOrigins (Default)</option>
            <option value="custom">Custom</option>
            <option value="none">None (Direct)</option>
        </select>
        <input type="text" id="cors-proxy" value="https://api.allorigins.win/raw?url=" placeholder="Proxy URL prefix..." />
    </div>
</header>

<div id="terminal-container"></div>

        "mrms_core.py": '"""MRMS radar data fetching — shared core library.\n\nFetches rendered radar PNGs from NOAA/NSSL MRMS Operational Product Viewer.\nNo S3, no GRIB2 — just HTTP GET → PNG bytes.\n"""\n\nimport os\nfrom dataclasses import dataclass\nfrom datetime import datetime, timezone\n\nimport requests\n\n# NOAA MRMS server does not send the intermediate CA certificate in its\n# TLS handshake (Sectigo Public Server Authentication CA DV R36).\n# This is a known server-side issue; suppress the InsecureRequestWarning.\nimport urllib3\nurllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)\n\n# ---------------------------------------------------------------------------\n# Constants\n# ---------------------------------------------------------------------------\n\nRENDER_URL = (\n    "https://mrms.nssl.noaa.gov/qvs/product_viewer/local/"\n    "render_multi_domain_product_layer.php"\n)\nLEGEND_URL = (\n    "https://mrms.nssl.noaa.gov/qvs/product_viewer/shared/"\n    "fetch_svg_legend_via_config.php"\n)\nCPP_EXEC_DIR = "/home/metop/web/specific/opv/"\nWEB_RESOURCES_DIR = "/var/www/html/qvs/product_viewer/resources/"\nREFERER = "https://mrms.nssl.noaa.gov/qvs/product_viewer/index.php"\n\n# Cache directory — relative to this file, gitignored\nCACHE_DIR = os.path.join(os.path.dirname(os.path.abspath(__file__)), "cache")\n\nimport json\n\n# Product Catalog\nPRODUCTS_JSON_PATH = os.path.join(os.path.dirname(os.path.abspath(__file__)), "mrms_products.json")\n\ndef _load_products_catalog() -> list:\n    try:\n        with open(PRODUCTS_JSON_PATH, "r", encoding="utf-8") as f:\n            return json.load(f)\n    except Exception:\n        return []\n\nPRODUCT_CATALOG = _load_products_catalog()\n\ndef get_product_metadata(product_code: str) -> dict | None:\n    """Find a product by its code in the catalog and return its details."""\n    for category in PRODUCT_CATALOG:\n        for product in category.get("products", []):\n            if product.get("code") == product_code:\n                return {\n                    "code": product.get("code"),\n                    "name": product.get("name"),\n                    "min_res_minutes": product.get("min_res_minutes", 2),\n                    "category_code": category.get("code"),\n                    "category_name": category.get("name"),\n                    "has_levels": category.get("has_levels", False),\n                }\n    return None\n\n\n# ---------------------------------------------------------------------------\n# Data model\n# ---------------------------------------------------------------------------\n\n\n@dataclass\nclass RadarImage:\n    """A fetched MRMS radar image with metadata."""\n\n    png_bytes: bytes\n    product: str\n    lat: float\n    lon: float\n    product_name: str = ""\n    zoom: int = 7\n    timestamp: str = ""\n    fetch_time: str = ""\n    source_url: str = ""\n    width: int = 920\n    height: int = 630\n    from_cache: bool = False\n\n    def get_bounds(self) -> tuple[float, float, float, float]:\n        """Return the geographic bounding box (min_lat, max_lat, min_lon, max_lon) for this image."""\n        return get_mercator_bounds(self.lat, self.lon, self.zoom, self.width, self.height)\n\n\n# ---------------------------------------------------------------------------\n# Time utilities\n# ---------------------------------------------------------------------------\n\n\ndef round_to_mrms_window(dt: datetime, resolution_mins: int = 2) -> datetime:\n    """Round a datetime down to the nearest MRMS window for the given resolution."""\n    minute = (dt.minute // resolution_mins) * resolution_mins\n    return dt.replace(minute=minute, second=0, microsecond=0)\n\n\n# ---------------------------------------------------------------------------\n# Spatial utilities\n# ---------------------------------------------------------------------------\n\n\ndef get_mercator_bounds(\n    clat: float, clon: float, zoom: int, width: int, height: int\n) -> tuple[float, float, float, float]:\n    """Calculate the geographic bounding box (min_lat, max_lat, min_lon, max_lon)\n    for a viewport with center (clat, clon), Leaflet zoom level, and pixel dimensions.\n    Uses standard Web Mercator (EPSG:3857) formulas.\n    """\n    import math\n    clat_rad = math.radians(clat)\n    \n    center_x = (clon + 180.0) / 360.0\n    center_y = (1.0 - math.log(math.tan(clat_rad) + 1.0 / math.cos(clat_rad)) / math.pi) / 2.0\n    \n    map_size = 256.0 * (2.0 ** zoom)\n    \n    left_x = (center_x * map_size - (width / 2.0)) / map_size\n    right_x = (center_x * map_size + (width / 2.0)) / map_size\n    top_y = (center_y * map_size - (height / 2.0)) / map_size\n    bottom_y = (center_y * map_size + (height / 2.0)) / map_size\n    \n    def x_to_lon(x):\n        return x * 360.0 - 180.0\n        \n    def y_to_lat(y):\n        val = math.pi * (1.0 - 2.0 * y)\n        lat_rad = 2.0 * math.atan(math.exp(val)) - math.pi / 2.0\n        return math.degrees(lat_rad)\n        \n    return y_to_lat(bottom_y), y_to_lat(top_y), x_to_lon(left_x), x_to_lon(right_x)\n\n\n\n# ---------------------------------------------------------------------------\n# Cache layer\n# ---------------------------------------------------------------------------\n\n\ndef _cache_key(\n    product: str,\n    year: int,\n    month: int,\n    day: int,\n    hour: int,\n    minute: int,\n    lat: float,\n    lon: float,\n    zoom: int,\n    width: int,\n    height: int,\n) -> str:\n    """Build a deterministic cache filename from request parameters."""\n    return (\n        f"{product}_{year:04d}{month:02d}{day:02d}_"\n        f"{hour:02d}{minute:02d}_"\n        f"{lat}_{lon}_{zoom}_"\n        f"{width}x{height}.png"\n    )\n\n\ndef _cache_save(key: str, png_bytes: bytes) -> None:\n    """Save PNG bytes to the cache directory."""\n    os.makedirs(CACHE_DIR, exist_ok=True)\n    path = os.path.join(CACHE_DIR, key)\n    with open(path, "wb") as f:\n        f.write(png_bytes)\n\n\ndef _cache_load(key: str) -> bytes | None:\n    """Load PNG bytes from cache, or None if not cached."""\n    path = os.path.join(CACHE_DIR, key)\n    if os.path.exists(path):\n        with open(path, "rb") as f:\n            return f.read()\n    return None\n\n\n# ---------------------------------------------------------------------------\n# Public API\n# ---------------------------------------------------------------------------\n\n\ndef fetch_radar(\n    product: str = "M3DL13",\n    lat: float = 40.55,\n    lon: float = -104.68,\n    zoom: int = 7,\n    width: int = 920,\n    height: int = 630,\n    year: int | None = None,\n    month: int | None = None,\n    day: int | None = None,\n    hour: int | None = None,\n    minute: int | None = None,\n) -> RadarImage:\n    """Fetch a rendered MRMS radar image from NOAA.\n\n    If *year* is ``None``, the current UTC time (rounded to the nearest\n    2-minute MRMS window) is used.\n    """\n    # --- resolve time -------------------------------------------------------\n    if year is None:\n        meta = get_product_metadata(product)\n        res_mins = meta["min_res_minutes"] if meta else 2\n        now = round_to_mrms_window(datetime.now(timezone.utc), res_mins)\n        # NOAA MRMS has processing latency — adjust back by at least one cycle\n        from datetime import timedelta\n        latency_mins = max(4, res_mins * 2)\n        now = now - timedelta(minutes=latency_mins)\n        year, month, day = now.year, now.month, now.day\n        hour, minute = now.hour, now.minute\n\n\n    # --- fetch from NOAA ----------------------------------------------------\n    from datetime import timedelta\n\n    for attempt in range(6):\n        # Check cache for current timestamp\n        assert year is not None\n        assert month is not None\n        assert day is not None\n        assert hour is not None\n        assert minute is not None\n        key = _cache_key(product, year, month, day, hour, minute,\n                         lat, lon, zoom, width, height)\n        cached = _cache_load(key)\n        if cached is not None:\n            # Check if cached image is blank\n            if len(cached) >= 1024:\n                return RadarImage(\n                    png_bytes=cached,\n                    product=product,\n                    lat=lat,\n                    lon=lon,\n                    zoom=zoom,\n                    width=width,\n                    height=height,\n                    timestamp=f"{year:04d}-{month:02d}-{day:02d}T{hour:02d}:{minute:02d}:00",\n                    fetch_time=datetime.now(timezone.utc).isoformat(),\n                    from_cache=True,\n                )\n\n        # Fetch from NOAA\n        params = {\n            "mode": "run",\n            "cpp_exec_dir": CPP_EXEC_DIR,\n            "web_resources_dir": WEB_RESOURCES_DIR,\n            "prod_root": product,\n            "qperate_pal_option": 0,\n            "qpe_pal_option": 0,\n            "year": year,\n            "month": month,\n            "day": day,\n            "hour": hour,\n            "minute": minute,\n            "clon": lon,\n            "clat": lat,\n            "zoom": zoom,\n            "width": width,\n            "height": height,\n        }\n\n        headers = {\n            "User-Agent": "Mozilla/5.0",\n            "Referer": REFERER,\n        }\n\n        fetch_time = datetime.now(timezone.utc)\n\n        r = requests.get(\n            RENDER_URL, params=params, headers=headers, timeout=30, verify=False\n        )\n        r.raise_for_status()\n\n        # Check if PNG is blank (transparent PNGs <1KB are typically empty)\n        if len(r.content) >= 1024:\n            # Save to cache and return\n            _cache_save(key, r.content)\n\n            # Resolve the actual URL that was fetched (for debugging).\n            req = getattr(r, "request", None)\n            source_url = req.url if req is not None else ""\n\n            return RadarImage(\n                png_bytes=r.content,\n                product=product,\n                lat=lat,\n                lon=lon,\n                zoom=zoom,\n                width=width,\n                height=height,\n                timestamp=f"{year:04d}-{month:02d}-{day:02d}T{hour:02d}:{minute:02d}:00",\n                fetch_time=fetch_time.isoformat(),\n                source_url=source_url,\n                from_cache=False,\n            )\n\n        # Step back 2 minutes and retry\n        dt = datetime(year, month, day, hour, minute, tzinfo=timezone.utc)\n        dt = dt - timedelta(minutes=2)\n        year, month, day = dt.year, dt.month, dt.day\n        hour, minute = dt.hour, dt.minute\n\n    # All attempts failed — return the last (blank) image\n    _cache_save(key, r.content)\n    req = getattr(r, "request", None)\n    source_url = req.url if req is not None else ""\n    return RadarImage(\n        png_bytes=r.content,\n        product=product,\n        lat=lat,\n        lon=lon,\n        zoom=zoom,\n        width=width,\n        height=height,\n        timestamp=f"{year:04d}-{month:02d}-{day:02d}T{hour:02d}:{minute:02d}:00",\n        fetch_time=fetch_time.isoformat(),\n        source_url=source_url,\n        from_cache=False,\n    )\n\n\ndef fetch_legend(product: str) -> str | None:\n    """Fetch the SVG colorbar legend for a given MRMS product.\n\n    Returns the raw SVG string, or ``None`` if the legend is unavailable.\n    Legends are cached on disk since they never change per product.\n    """\n    cache_key = f"legend_{product}.svg"\n    cached = _cache_load(cache_key)\n    if cached is not None:\n        return cached.decode("utf-8")\n\n    params = {\n        "web_resources_dir": WEB_RESOURCES_DIR,\n        "config_name": "title_and_legend_config.txt",\n        "product": product,\n    }\n\n    headers = {\n        "User-Agent": "Mozilla/5.0",\n        "Referer": REFERER,\n    }\n\n    try:\n        r = requests.get(\n            LEGEND_URL, params=params, headers=headers, timeout=15, verify=False\n        )\n        r.raise_for_status()\n    except Exception:\n        return None\n\n    svg = r.text\n    if not svg or "<svg" not in svg:\n        return None\n\n    _cache_save(cache_key, svg.encode("utf-8"))\n    return svg\n',
        "mrms_cli.py": '"""MRMS Radar CLI — fetch NOAA radar imagery from the terminal.\n\nUsage:\n    mrms fetch                              # defaults: M3DL13, Denver, now\n    mrms fetch --product BREF --lat 35 -lon -97 --zoom 5\n    mrms fetch --time 2026-01-15T08:30\n    mrms fetch --width 1200 --height 800 -o ~/Desktop/storm.png\n"""\n\nimport click\nfrom datetime import datetime\n\nfrom mrms_core import fetch_radar, round_to_mrms_window, PRODUCT_CATALOG, get_product_metadata\n\n\n@click.group()\ndef cli():\n    """MRMS Radar — fetch rendered radar imagery from NOAA/NSSL MRMS.\n\n    Default product is M3DL13 (3D Reflectivity at 4.0 km) centered on\n    Denver, CO (40.55, -104.68) at zoom level 7.\n    """\n    pass\n\n\n@cli.command()\n@click.option(\n    "--product", "-p",\n    default="M3DL13",\n    help="MRMS product code (e.g., M3DL13, BREF, CREF, SHSR).",\n)\n@click.option(\n    "--lat",\n    default=40.55,\n    type=float,\n    help="Center latitude (default: 40.55 — Denver, CO).",\n)\n@click.option(\n    "--lon",\n    default=-104.68,\n    type=float,\n    help="Center longitude (default: -104.68 — Denver, CO).",\n)\n@click.option(\n    "--zoom", "-z",\n    default=7,\n    type=int,\n    help="Leaflet zoom level: 3=continent, 7=state, 10=city (default: 7).",\n)\n@click.option(\n    "--width", "-W",\n    default=920,\n    type=int,\n    help="Image width in pixels (default: 920).",\n)\n@click.option(\n    "--height", "-H",\n    default=630,\n    type=int,\n    help="Image height in pixels (default: 630).",\n)\n@click.option(\n    "--time", "-t",\n    default=None,\n    help="Timestamp in ISO 8601 format (e.g., 2026-06-06T16:30). "\n         "Defaults to current UTC time rounded to 2-min MRMS window.",\n)\n@click.option(\n    "--output", "-o",\n    default=None,\n    type=click.Path(dir_okay=False, writable=True),\n    help="Output file path. Defaults to radar_YYYYMMDD_HHMM.png.",\n)\ndef fetch(product, lat, lon, zoom, width, height, time, output):\n    """Fetch a radar image from NOAA MRMS and save it to disk.\n\n    Examples:\\n\n      \\b\n      mrms fetch\n      mrms fetch --product BREF --lat 35.0 --lon -97.0\n      mrms fetch --time 2026-01-15T08:30 -o storm.png\n      mrms fetch --width 1200 --height 800\n    """\n    # Validate product\n    meta = get_product_metadata(product)\n    if meta is None:\n        import difflib\n        all_codes = []\n        for category in PRODUCT_CATALOG:\n            for p in category.get("products", []):\n                all_codes.append(p.get("code"))\n        matches = difflib.get_close_matches(product, all_codes, n=3, cutoff=0.5)\n        \n        click.echo(f"Warning: \'{product}\' is not recognized in the product catalog.", err=True)\n        if matches:\n            click.echo(f"Did you mean one of these? {\', \'.join(matches)}", err=True)\n        else:\n            click.echo("Use \'python mrms_cli.py products\' to list all recognized codes.", err=True)\n\n    # Resolve time\n    if time is not None:\n        dt = datetime.fromisoformat(time)\n        res_mins = meta["min_res_minutes"] if meta else 2\n        dt = round_to_mrms_window(dt, res_mins)\n        year, month, day = dt.year, dt.month, dt.day\n        hour, minute = dt.hour, dt.minute\n        img = fetch_radar(\n            product=product, lat=lat, lon=lon, zoom=zoom,\n            width=width, height=height,\n            year=year, month=month, day=day, hour=hour, minute=minute,\n        )\n    else:\n        img = fetch_radar(\n            product=product, lat=lat, lon=lon, zoom=zoom,\n            width=width, height=height,\n        )\n\n    # Determine output path\n    if output is None:\n        output = (\n            f"radar_"\n            f"{img.timestamp.replace(\'-\', \'\').replace(\':\', \'\').replace(\'T\', \'_\')}"\n            f".png"\n        )\n\n    # Save\n    with open(output, "wb") as f:\n        f.write(img.png_bytes)\n\n    cache_tag = " (cached)" if img.from_cache else ""\n    click.echo(\n        f"Saved {output}  "\n        f"({len(img.png_bytes):,} bytes, {img.width}\\u00d7{img.height})"\n        f"{cache_tag}"\n    )\n\n\n@cli.command()\n@click.option(\n    "--category", "-c",\n    default=None,\n    help="Filter products by category code or name.",\n)\ndef products(category):\n    """List all available MRMS categories and product codes."""\n    if category:\n        cat_lower = category.lower()\n        found = False\n        for cat in PRODUCT_CATALOG:\n            if cat_lower in (cat["code"].lower(), cat["name"].lower()):\n                found = True\n                click.echo(f"\\n{cat[\'name\']} ({cat[\'code\']}):")\n                for p in cat["products"]:\n                    click.echo(f"  {p[\'code\']:15} - {p[\'name\']} ({p[\'min_res_minutes\']} min res)")\n        if not found:\n            click.echo(f"Category \'{category}\' not found.", err=True)\n    else:\n        click.echo("MRMS Categories:")\n        for cat in PRODUCT_CATALOG:\n            click.echo(f"- {cat[\'code\']:12} : {cat[\'name\']}")\n        click.echo("\\nUse \'--category <name>\' to list all specific product codes under a category.")\n\n\nif __name__ == "__main__":\n    cli()\n'

        // Normalize newlines for xterm

        const select = document.getElementById('proxy-select').value;
        if (select === 'none') return '';
        return document.getElementById('cors-proxy').value;

        const blob = new Blob([bytes], { type: 'image/png' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();

    };

    function toggleProxyInput() {
        const select = document.getElementById('proxy-select').value;
        const input = document.getElementById('cors-proxy');
        if (select === 'allorigins') {
            input.value = "https://api.allorigins.win/raw?url=";
            input.disabled = true;
        } else if (select === 'custom') {
            input.disabled = false;
            input.focus();
        } else {
            input.value = "";
            input.disabled = true;
        }

            document.getElementById('status-text').innerText = "Ready";

            showPrompt();
            
            // Start listening to stdin inputs
